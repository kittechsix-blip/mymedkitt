<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#42A5F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Thoracotomy">
<title>Resuscitative Thoracotomy — ED Trauma</title>

<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  /* Sterile Surgical Suite palette */
  --bg:#F7FBFF;              /* ultra-light azure */
  --card:#ffffff;
  --ink:#263238;            /* dark slate */
  --ink-soft:#546E7A;       /* slate-grey secondary */
  --line:#E1ECF4;
  --accent:#42A5F5;          /* hospital blue */
  --accent-deep:#1E88E5;     /* pressed / deep blue */
  --accent-tint:#E3F2FD;     /* azure tint */
  --accent-2:#90CAF9;        /* secondary / interactive icons */
  --danger:#d2453b;
  --danger-tint:#fbeae8;
  --warn:#c9772a;
  --ok:#1f9d6b;
  --shadow:0 6px 24px rgba(38,50,56,.08);
  --shadow-lg:0 16px 48px rgba(38,50,56,.16);
  --shadow-card:0 2px 8px rgba(38,50,56,.06),0 0 1px rgba(38,50,56,.10);
  --r:18px;
  --r-xl:20px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;background:var(--bg)}

/* ---------- Top bar / progress ---------- */
.topbar{
  padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 6px;
  display:flex;align-items:center;gap:12px;
  background:rgba(247,251,255,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:6;
}
.brand{font-weight:740;font-size:15px;letter-spacing:.2px}
.brand small{color:var(--accent-deep);font-weight:700}
.step-count{margin-left:auto;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* tappable pill row — jump to any card */
.pillrow{
  display:flex;gap:8px;overflow-x:auto;padding:2px 14px 10px;
  background:rgba(247,251,255,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  scrollbar-width:none;z-index:6;
}
.pillrow::-webkit-scrollbar{display:none}
.npill{
  flex:none;display:inline-flex;align-items:center;gap:5px;
  padding:7px 13px;border-radius:99px;font-size:12.5px;font-weight:650;line-height:1;
  white-space:nowrap;min-height:34px;cursor:pointer;border:1.5px solid transparent;
  background:rgba(38,50,56,.05);color:var(--ink-soft);transition:all .2s ease;
}
.npill:active{transform:scale(.95)}
.npill.current{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(66,165,245,.35)}
.npill.visited{background:var(--accent-tint);color:var(--accent-deep);border-color:var(--accent-2)}
.npill.danger.current{background:var(--danger);box-shadow:0 2px 8px rgba(210,69,59,.35)}

/* ---------- Deck ---------- */
.deck{
  flex:1;display:flex;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.deck::-webkit-scrollbar{display:none}
.slide{
  min-width:100%;scroll-snap-align:center;scroll-snap-stop:always;
  height:100%;overflow-y:auto;padding:4px 18px 140px;scrollbar-width:none;
}
.slide::-webkit-scrollbar{display:none}

.kicker{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.pill{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent-deep);background:var(--accent-tint);padding:5px 10px;border-radius:99px}
.pill.danger{color:#9a261d;background:var(--danger-tint)}
.h1{font-size:25px;font-weight:760;line-height:1.12;letter-spacing:-.3px;margin:0 0 14px}

/* photo slot */
.photo{
  position:relative;width:100%;aspect-ratio:4/3;border-radius:var(--r-xl);
  background:radial-gradient(120% 120% at 30% 20%,#eef6ff 0%,#e3f0fb 60%,#d8e8f6 100%);
  border:1px solid var(--line);box-shadow:var(--shadow-card);
  overflow:hidden;
}
.photo img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
/* side-by-side photos (e.g. illustration + clinical photo) */
.photo-row{display:flex;gap:10px}
.photo-row .photo{flex:1;min-width:0}
/* 3+ photos: hero on top, pair below */
.photo-stack{display:flex;flex-direction:column;gap:10px}
.photo .ph-fallback{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-soft);text-align:center;padding:12px}
.photo .ph-ic{width:38px;height:38px;opacity:.5}
.photo .ph-label{font-size:12.5px;font-weight:600;max-width:80%;line-height:1.35}
.photo .ph-tag{position:absolute;z-index:2;top:10px;left:10px;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#fff;background:rgba(66,165,245,.94);padding:4px 8px;border-radius:8px}

/* action + caption */
.action{font-size:20px;font-weight:720;line-height:1.25;letter-spacing:-.2px;margin:16px 2px 6px}
.caption{font-size:14.5px;line-height:1.5;color:var(--ink-soft);margin:0 2px}
.cue{display:inline-flex;align-items:center;gap:6px;margin:12px 2px 0;font-size:13px;font-weight:650;color:var(--danger);background:var(--danger-tint);padding:8px 12px;border-radius:12px}
.cue.warn{color:var(--warn);background:#fbf1e4}

/* accordion */
.more{margin:16px 0 0;border-top:1px solid var(--line);padding-top:6px}
.more details{border-radius:14px;overflow:hidden}
.more summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
  padding:12px 2px;font-size:14px;font-weight:680;color:var(--accent-deep);
}
.more summary::-webkit-details-marker{display:none}
.more summary .chev{margin-left:auto;transition:transform .25s;color:var(--accent)}
.more details[open] summary .chev{transform:rotate(180deg)}
.more .body{padding:2px 2px 8px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.more ul{margin:4px 0 0;padding:0 0 0 18px}
.more li{font-size:14px;line-height:1.6;color:var(--ink);margin:0 0 7px}
.more li b{font-weight:680}
.ref{font-size:11.5px;color:var(--ink-soft);font-style:italic;margin-top:6px}

/* nav arrows */
.nav{position:absolute;bottom:calc(74px + var(--safe-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none;z-index:5}
.nav button{
  pointer-events:auto;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent-deep);cursor:pointer;
  transition:transform .15s, opacity .2s;
}
.nav button:active{transform:scale(.92)}
.nav button[disabled]{opacity:0;pointer-events:none}

/* ---------- Indication gate ---------- */
.gate{padding-top:8px}
.gate .lead{font-size:15px;color:var(--ink-soft);line-height:1.5;margin:0 2px 18px}
.qrow{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);margin:18px 2px 10px}
.opts{display:grid;gap:10px}
.opt{
  display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1px solid var(--line);
  background:var(--card);box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,border-color .15s;
}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-tint),var(--shadow)}
.opt .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent-deep);flex:none}
.opt.red .ic{background:var(--danger-tint);color:#9a261d}
.opt .tt{font-size:16px;font-weight:700}
.opt .ss{font-size:13px;color:var(--ink-soft);margin-top:2px;line-height:1.4}
.result{margin-top:18px;border-radius:16px;padding:18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);animation:fade .3s ease}
.result.go{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-tint),#fff)}
.result.stop{border-color:var(--danger);background:linear-gradient(180deg,var(--danger-tint),#fff)}
.result .verdict{font-size:18px;font-weight:760;margin:0 0 6px}
.result.go .verdict{color:var(--accent-deep)}
.result.stop .verdict{color:#9a261d}
.result p{font-size:14px;line-height:1.55;color:var(--ink);margin:0 0 6px}
.startbtn{margin-top:14px;width:100%;border:0;border-radius:var(--r);padding:15px;font-size:16px;font-weight:720;color:#fff;
  background:linear-gradient(180deg,#64B5F6 0%,#42A5F5 45%,#1E88E5 100%);
  box-shadow:0 4px 12px rgba(66,165,245,.32),inset 0 1px 0 rgba(255,255,255,.25);
  text-shadow:0 1px 2px rgba(0,0,0,.12);cursor:pointer;transition:all .15s ease}
.startbtn:active{transform:translateY(1px);box-shadow:0 2px 6px rgba(66,165,245,.28),inset 0 1px 0 rgba(255,255,255,.2)}
.criteria{margin-top:12px;display:grid;gap:8px}
.crit{display:flex;gap:10px;font-size:13.5px;line-height:1.45;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.crit b{font-weight:720}
.crit .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--ok)}
.crit.no .dot{background:var(--ink-soft)}
.crit.stop .dot{background:var(--danger)}

/* ---------- Bottom toolbar ---------- */
.toolbar{
  position:absolute;left:0;right:0;bottom:0;z-index:8;
  padding:8px 0 calc(8px + var(--safe-bottom));
  background:rgba(255,255,255,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
}
.toolbar .scroll{display:flex;gap:8px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.toolbar .scroll::-webkit-scrollbar{display:none}
.tool{
  flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;width:62px;padding:6px 2px;border:0;background:none;cursor:pointer;color:var(--ink-soft)}
.tool .tic{width:42px;height:42px;border-radius:14px;background:var(--accent-tint);color:var(--accent-deep);display:grid;place-items:center;transition:transform .12s,background .15s}
.tool:active .tic{transform:scale(.9)}
.tool .tl{font-size:10.5px;font-weight:650;line-height:1.1;text-align:center}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(13,28,34,.42);opacity:0;pointer-events:none;transition:opacity .28s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;margin:0 auto;
  background:var(--card);border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);
  transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  max-height:86dvh;display:flex;flex-direction:column;
}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:38px;height:5px;border-radius:99px;background:var(--line);margin:10px auto 4px}
.sheet .shead{display:flex;align-items:center;gap:12px;padding:6px 20px 12px;border-bottom:1px solid var(--line)}
.sheet .shead .si{width:40px;height:40px;border-radius:12px;background:var(--accent-tint);color:var(--accent-deep);display:grid;place-items:center;flex:none}
.sheet .shead h3{margin:0;font-size:18px;font-weight:740}
.sheet .shead .x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-soft);cursor:pointer}
.sheet .scont{overflow-y:auto;padding:16px 20px calc(26px + var(--safe-bottom))}
.sheet h4{font-size:14px;font-weight:740;margin:18px 0 8px;color:var(--accent-deep)}
.sheet h4:first-child{margin-top:2px}
.sheet p{font-size:14.5px;line-height:1.58;color:var(--ink);margin:0 0 10px}
.sheet ul{margin:0 0 12px;padding-left:18px}
.sheet li{font-size:14.5px;line-height:1.55;margin:0 0 7px}
.sheet .kv{display:flex;gap:10px;align-items:baseline;padding:11px 13px;background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.sheet .kv .k{font-weight:740;font-size:14px;flex:none;min-width:78px;color:var(--accent-deep)}
.sheet .kv .v{font-size:14px;line-height:1.5}
.sheet .big{font-size:30px;font-weight:780;letter-spacing:-.5px;color:var(--accent-deep);margin:2px 0 2px}
.sheet .note{font-size:12.5px;color:var(--ink-soft);font-style:italic;line-height:1.5}
.sheet .callout{border-left:3px solid var(--danger);background:var(--danger-tint);padding:10px 14px;border-radius:0 12px 12px 0;font-size:13.5px;line-height:1.5;margin:4px 0 12px;color:#7d211a}
.sheet .callout.warn{border-color:var(--warn);background:#fbf1e4;color:#7a4a16}
.sheet .img-slot{width:100%;aspect-ratio:16/10;border-radius:14px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-soft);font-size:12.5px;font-weight:600;margin:4px 0 14px;text-align:center;padding:0;overflow:hidden}
.sheet .img-slot img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.sheet .qr-wrap{display:flex;justify-content:center;margin:6px 0 14px}
.sheet .qr-wrap img{width:220px;height:220px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px}
.sheet a.calc-link{color:var(--accent-deep);font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.sheet .mergo{margin:8px 0 12px;border:1px solid var(--accent-2);border-radius:14px;background:var(--accent-tint);padding:14px}
.sheet .mergo .mrow{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.sheet .mergo label{font-size:13.5px;font-weight:680;color:var(--accent-deep);flex:1;line-height:1.3}
.sheet .mergo input{width:84px;flex:none;font-size:16px;font-weight:700;text-align:center;padding:8px;border:1px solid var(--accent-2);border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
.sheet .mergo .mout{margin-top:4px;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:14px;line-height:1.5}
.sheet .mergo .mout .mvol{font-size:22px;font-weight:780;letter-spacing:-.5px;display:block;margin-bottom:4px}
.sheet .mergo .mout.go{border-color:var(--danger);background:var(--danger-tint);color:#7d211a}
.sheet .mergo .mout.go .mvol{color:var(--danger)}
.sheet .mergo .mout.obs{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-tint),#fff)}
.sheet .mergo .mout.obs .mvol{color:var(--accent-deep)}
.sheet .mergo .mhint{font-size:11.5px;color:var(--ink-soft);font-style:italic;margin:8px 0 0;line-height:1.45}

svg{display:block}

/* ============ tap-to-zoom lightbox ============ */
.photo img,.img-slot img{cursor:zoom-in}
.lightbox{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.93);display:none;place-items:center;touch-action:none;overscroll-behavior:contain;user-select:none}
.lightbox.open{display:grid}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;will-change:transform;-webkit-user-drag:none;user-select:none;touch-action:none}
.lightbox.zoomed img{cursor:grab}
.lightbox.zoomed.panning img{cursor:grabbing}
.lightbox-close{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:28px;line-height:1;display:grid;place-items:center;cursor:pointer;z-index:1;-webkit-tap-highlight-color:transparent}
.lightbox-close:active{background:rgba(255,255,255,.3)}
.lightbox-hint{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:12px;font-weight:600;letter-spacing:.3px;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">Resus&nbsp;Thoracotomy <small>· ED Trauma</small></div>
    <div class="step-count" id="stepCount"></div>
  </div>
  <div class="pillrow" id="pillRow"><!-- pills injected --></div>

  <div class="deck" id="deck"><!-- slides injected --></div>

  <div class="nav">
    <button id="prevBtn" aria-label="Previous">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="nextBtn" aria-label="Next">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <div class="toolbar">
    <div class="scroll" id="toolScroll"><!-- tools injected --></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="shead">
    <div class="si" id="sheetIcon"></div>
    <h3 id="sheetTitle"></h3>
    <button class="x" id="sheetClose" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="scont" id="sheetBody"></div>
</div>

<script>
/* ============ ICONS ============ */
const I = {
  pneumo:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6"/><path d="M12 9c-3 0-5 2-5 6 0 3 1 6 5 6s5-3 5-6c0-4-2-6-5-6z"/></svg>',
  hemo:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
  bolt:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  check:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  ruler:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16l13-13 5 5L8 21z"/><path d="M8 9l2 2M11 6l2 2M14 12l2 2"/></svg>',
  list:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  drain:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10M8 3v4l-2 9a3 3 0 0 0 3 4h6a3 3 0 0 0 3-4l-2-9V3"/><path d="M6.5 14h11"/></svg>',
  wrench:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 1 5.4-5.4l-2.5 2.5-1.6-1.6 2.6-2.5z"/></svg>',
  pull:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',

const deck = document.getElementById('deck');
function photoHTML(s){
  const tag = `<span class="ph-tag">${s.photoTag||'Photo'}</span>`;
  const fullFallback = `<div class="ph-fallback">${I.camera}<span class="ph-label">${s.photoLabel||'Add image'}</span></div>`;
  const imgs = s.img ? (Array.isArray(s.img) ? s.img : [s.img]) : [];
  if(imgs.length===0){
    return `<div class="photo">${tag}${fullFallback}</div>`;
  }
  const alt=(s.photoLabel||s.photoTag||'').replace(/"/g,'');
  // real photos: no overlay tag (it would cover the image); tag only labels placeholders
  const cell = f => `<div class="photo">
      <div class="ph-fallback">${I.camera}</div>
      <img src="images/${f}" alt="${alt}" loading="lazy" onerror="this.remove()">
    </div>`;
  if(imgs.length===1){
    return `<div class="photo">${fullFallback}
      <img src="images/${imgs[0]}" alt="${alt}" loading="lazy" onerror="this.remove()">
    </div>`;
  }
  if(imgs.length===2){
    return `<div class="photo-row">${imgs.map(cell).join('')}</div>`;
  }
  // 3+ images → first full-width (hero), the rest in a row below
  return `<div class="photo-stack">${cell(imgs[0])}<div class="photo-row">${imgs.slice(1).map(cell).join('')}</div></div>`;
}
function stepHTML(s){
  const cue = s.cue ? `<div class="cue ${s.danger?'':'warn'}">⚠ ${s.cue}</div>` : '';
  const more = s.more ? `<div class="more"><details><summary>More detail &amp; evidence ${I.chev}</summary>
      <div class="body"><ul>${s.more.map(m=>`<li>${m}</li>`).join('')}</ul>
      ${s.ref?`<div class="ref">${s.ref}</div>`:''}</div></details></div>` : '';
  return `<div class="slide">
    <div class="kicker"><span class="pill ${s.danger?'danger':''}">${s.pill}</span></div>
    <h1 class="h1">${s.title}</h1>
    ${photoHTML(s)}
    <div class="action">${s.action}</div>
    <p class="caption">${s.caption}</p>
    ${cue}
    ${more}
  </div>`;
}

let mech=null, site=null, sol=null;
function renderGateResult(){
  const box = document.getElementById('gateResult');
  const start = `<button class="startbtn" onclick="goTo(1)">Start the procedure →</button>`;
  const confirm = `<div class="criteria">
    <div class="crit stop"><span class="dot"></span><span><b>FAST:</b> no cardiac motion → 0% survival (100% NPV) → stop, it’s futile.</span></div>
    <div class="crit no"><span class="dot"></span><span><b>Downtime:</b> CPR &gt;15 min (penetrating) or &gt;10 min (blunt) → don’t proceed.</span></div>
    <div class="crit no"><span class="dot"></span><span><b>Peds, no signs of life:</b> 100% mortality — do not perform.</span></div>
  </div>`;

  // wait until the active branch is fully answered
  if(!mech){ box.innerHTML=''; return; }
  if(mech==='pen' && !site){ box.innerHTML=''; return; }
  if(!sol){ box.innerHTML=''; return; }

  let cls='go', verdict='', body='', east='';
  if(mech==='pen' && site==='thoracic' && sol==='yes'){
    verdict='Go — strongest indication.';
    body='Penetrating thoracic injury with signs of life is exactly the patient this procedure was designed for. Survival climbs as high as <b>21.3%</b>.';
    east='EAST PICO 1 — Strong recommendation';
  } else if(mech==='pen' && site==='thoracic' && sol==='no'){
    verdict='Reasonable — conditional.';
    body='Penetrating thoracic injury without signs of life. Lower yield, but a reasonable attempt if downtime is short and FAST shows cardiac motion.';
    east='EAST PICO 2 — Conditional recommendation';
  } else if(mech==='pen' && site==='extra' && sol==='yes'){
    verdict='Consider — conditional.';
    body='Penetrating extra-thoracic injury with signs of life. The chest isn’t the bleeding source, but aortic cross-clamping can buy time. Reasonable to proceed.';
    east='EAST PICO 3 — Conditional recommendation';
  } else if(mech==='pen' && site==='extra' && sol==='no'){
    verdict='Consider — conditional.';
    body='Penetrating extra-thoracic injury without signs of life. Low yield; proceed only with short downtime and cardiac motion on FAST.';
    east='EAST PICO 4 — Conditional recommendation';
  } else if(mech==='blunt' && sol==='yes'){
    verdict='Low yield — conditional.';
    body='Blunt injury with signs of life. Blunt arrest survival is only <b>~1.4%</b> — reasonable to attempt, but temper expectations and lean hard on FAST and downtime.';
    east='EAST PICO 5 — Conditional recommendation';
  } else if(mech==='blunt' && sol==='no'){
    cls='stop';
    verdict='Stop — don’t proceed.';
    body='Blunt injury <b>without</b> signs of life is a non-survivable presentation. Guidelines recommend <b>against</b> thoracotomy here — recognize futility and protect the team.';
    east='EAST PICO 6 — Conditional recommendation against';
  }

  const tail = cls==='go'
    ? confirm + start
    : `<p class="note" style="font-style:italic;color:var(--ink-soft);font-size:12.5px;margin-top:10px">A non-therapeutic thoracotomy consumes the team and exposes everyone to sharps. Recognizing a non-survivable injury — and pivoting those resources — is the right call.</p>`;

  box.innerHTML = `<div class="result ${cls}">
    <div class="verdict">${verdict}</div>
    <p>${body}</p>
    <div class="ref" style="margin:2px 0 0">${east}</div>
    ${tail}</div>`;
}

function setActive(i){
  idx=i; visited.add(i);
  count.textContent = i===0 ? 'Indication gate'
    : i===1 ? 'Before you start'
    : `Step ${i-1} / ${slides.length-2}`;
  prevBtn.disabled = i===0;
  nextBtn.disabled = i===slides.length-1;
  pills.forEach((p,k)=>{

  });

}

function clamTool(){return `

function anatTool(){return `
  <div class="img-slot"><img src="images/rt-anatomy.png" alt="Thoracic surgical anatomy" loading="lazy" onerror="this.closest('.img-slot').textContent='Add images/rt-anatomy.png for a labeled diagram'"></div>

  <ul>
    <li>Target the <b>4th–5th intercostal space</b> — just below the nipple in men, the inframammary fold in women.</li>
    <li>The intercostal <b>neurovascular bundle (vein–artery–nerve)</b> runs in the costal groove on the <b>underside</b> of each rib. Cut along the <b>top of the lower rib</b> to stay off it.</li>

  <ul>
    <li>The <b>phrenic nerve</b> runs craniocaudally along the lateral surface of the pericardium.</li>
    <li>Open the pericardium <b>anterior and parallel to the phrenic</b>, caudal → cephalad, starting near the diaphragm — keeps you off the nerve and the coronary vessels.</li>

    <li>The <b>esophagus</b> sits <b>anterior and slightly medial</b> to the aorta — the OG/NG tube (± a TEE probe) lets you tell them apart.</li>
    <li>Both are covered by <b>mediastinal pleura</b>, which you divide before encircling the aorta.</li>
    <li>Release the <b>inferior pulmonary ligament</b> to mobilize the lung and reach the aorta.</li>
  </ul>

  <ul>
    <li>The <b>pulmonary hilum</b> (PA, pulmonary veins, bronchus) can be clamped or twisted to control massive lung hemorrhage.</li>

function crossClampTool(){return `
  <div class="img-slot"><img src="images/rt-09-crossclamp.png" alt="Descending thoracic aortic cross-clamp" loading="lazy" onerror="this.closest('.img-slot').textContent='Add images/rt-09-crossclamp.png'"></div>
  <p><b>Goal:</b> temporary descending thoracic aortic occlusion during ED thoracotomy to preserve coronary/cerebral perfusion and reduce hemorrhage below the diaphragm while definitive control is being arranged.</p>
  <div class="callout">Start the clock when the clamp goes on. Aim for complete removal or conversion/repositioning below the renal vessels within <b>30 minutes</b>.</div>
  <h4>When to clamp</h4>
  <ul>
    <li>Traumatic arrest or profound hemorrhagic shock after the chest is open, especially with suspected abdominal, pelvic, neck, or extremity hemorrhage.</li>
    <li>Persistent hypotension after tamponade relief, internal massage, transfusion, and control of visible chest bleeding.</li>
    <li>No cardiac activity after a brief period of open cardiac massage and ATLS resuscitation, when aortic occlusion may improve coronary filling.</li>
    <li><b>Do not clamp a normotensive patient</b>: afterload rises and cardiac performance can worsen.</li>
  </ul>
  <h4>Best tool</h4>
  <ul>
    <li><b>Satinsky vascular clamp:</b> atraumatic, curved, side-biting. Good ED tray choice for aorta or hilum.</li>
    <li><b>DeBakey aortic clamp:</b> atraumatic vascular clamp, also appropriate.</li>
    <li><b>Manual/finger occlusion:</b> acceptable temporary bridge if the vascular clamp is not immediately in hand.</li>
    <li><b>Do not use a Kelly or generic hemostat</b> on the aorta. Crushing clamp equals vessel injury.</li>
  </ul>
  <h4>How to find it</h4>
  <ol>
    <li>Retract the left lung superior/anterior and release the inferior pulmonary ligament if needed.</li>
    <li>Use the <b>OG/NG tube</b> or TEE probe to identify the esophagus. The esophagus is anterior/medial to the aorta.</li>
    <li>Find the descending thoracic aorta: posterior, leftward, tubular, against the vertebral bodies.</li>
    <li>Divide the mediastinal pleura over the aorta and bluntly free it from the esophagus anteriorly and prevertebral fascia posteriorly.</li>
    <li>Clamp in an <b>intervertebral space</b> to reduce intercostal vessel injury. Ideal site: just above the diaphragm; acceptable site: below the left pulmonary hilum.</li>
  </ol>
  <h4>What the clamp buys</h4>
  <ul>
    <li>Redistributes limited central volume toward myocardium and brain.</li>
    <li>Reduces subdiaphragmatic hemorrhage until the abdomen, pelvis, or extremity source can be controlled.</li>
    <li>May improve coronary filling during open cardiac massage and resuscitation.</li>
  </ul>
  <h4>Clock and release</h4>
  <ul>
    <li><b>Target: 30 minutes or less.</b> Warm visceral and spinal ischemia rise fast distal to the clamp.</li>
    <li>Move to the OR immediately after ROSC or salvage physiology. This is a bridge, not definitive hemorrhage control.</li>
    <li>Expect reperfusion trouble when it comes off: acidosis, hyperkalemia, hypotension, and recurrent distal bleeding.</li>
  </ul>
  <h4>Failure traps</h4>
  <ul>
    <li>Clamping the esophagus with the aorta or clamping only the esophagus.</li>
    <li>Incomplete clamp because the pleura was not opened enough.</li>
    <li>Putting the clamp through intercostal vessels rather than an intervertebral space.</li>
    <li>Leaving the clamp on while the team forgets the abdomen/pelvis/external hemorrhage source still needs control.</li>
  </ul>
  <p class="note">Sources: Western Trauma Association ERT algorithm and Note I; StatPearls Emergency Room Thoracotomy; Cothren Burlew et al. ED thoracotomy review.</p>`;}

function heartTool(){return `
  <div class="img-slot"><img src="images/rt-heart-repair.png" alt="Exposed heart with ventricular wound during repair" loading="lazy" onerror="this.closest('.img-slot').textContent='Add images/rt-heart-repair.png'"></div>
  <p>Once the pericardium is open and the heart delivered, <b>control the wound first, then repair</b>. Most ED losses here come from chasing the perfect stitch before the bleeding is controlled — temporize, then sew.</p>
  <h4>1 · Temporary control</h4>
  <ul>
    <li><b>Finger / digital pressure</b> — a fingertip over the hole is the fastest control. Start here.</li>
    <li><b>Foley catheter:</b> pass a 14–16 Fr Foley through the wound, inflate the balloon with <b>~10–15 mL saline</b>, and apply <b>gentle</b> traction to tamponade. <b>Clamp the catheter</b> so you don't bleed out the lumen — and it doubles as a port for rapid transfusion.</li>
    <li><b>Skin staples:</b> a fast, evidence-supported temporizing option for ventricular lacerations — hemostasis comparable to suture and quicker in the ED; definitive repair later.</li>
    <li><b>Satinsky (partial-occlusion) clamp:</b> best for thin-walled <b>atrial</b> and great-vessel wounds — clamp and oversew.</li>
  </ul>
  <div class="callout">Don't yank a Foley back out under tension — you'll enlarge the laceration. Inflate gently; over-inflation can tear a friable wound.</div>
  <h4>2 · Definitive suture repair</h4>
  <ul>
    <li><b>Suture:</b> non-absorbable monofilament — <b>2-0 or 3-0 polypropylene (Prolene)</b> on a large needle for the ventricle; <b>3-0/4-0</b> for the thinner atrium.</li>
    <li><b>Pledgets:</b> buttress ventricular repairs with <b>Teflon/pericardial pledgets</b> in a horizontal-mattress configuration — friable myocardium cheese-wires through unsupported stitches.</li>
    <li><b>Near a coronary:</b> place <b>horizontal mattress sutures BENEATH the coronary artery</b> so you don't ligate it.</li>
    <li>Throw each stitch while a finger controls the bleeding; tie just snug, not tight.</li>
  </ul>
  <h4>3 · The Foley afterward</h4>
  <ul>
    <li>Once sutures are placed around it and hemostasis looks secure, <b>deflate and remove</b> the Foley, then tie down the last suture.</li>
    <li>Keep it clamped until removed. A staple/Foley temporary repair is fine for transport — definitive cardiorrhaphy belongs in the OR.</li>
  </ul>
  <p class="note">Emergency cardiorrhaphy — finger/Foley/skin-staple temporization, pledgeted 2-0/3-0 polypropylene, sutures placed beneath coronaries (ATLS; EAST; Hirshberg &amp; Mattox, <i>Top Knife</i>).</p>`;}

function hilumTool(){return `
  <p>Two ways to control a bleeding lung at its root — both occlude the pulmonary artery, veins, and bronchus together.</p>
  <h4>When to do it</h4>

    <li><b>Massive air embolism</b> (or high risk) from a deep lung laceration — occluding the hilum stops air tracking into the pulmonary veins and on to the coronaries/brain.</li>
    <li>As a <b>damage-control</b> step to buy time before definitive repair (pneumonorrhaphy, wedge, lobectomy, or pneumonectomy in the OR).</li>
    <li>Release the <b>inferior pulmonary ligament</b> first to mobilize the lung for either maneuver.</li>

  <ul>
    <li>Apply a large <b>atraumatic vascular clamp</b> (Satinsky/aortic or long DeBakey) across the <b>entire hilum</b> — PA + pulmonary veins + bronchus.</li>

  </ul>
  <h4>Hilar twist</h4>
  <div class="img-slot"><img src="images/rt-hilar-twist.png" alt="Hilar twist — rotating the lung 180 degrees" loading="lazy" onerror="this.closest('.img-slot').textContent='Add images/rt-hilar-twist.png'"></div>
  <ul>
    <li>No clamp needed and <b>faster</b>: divide the inferior pulmonary ligament, then <b>rotate the lung ~180°</b> — bring the lower lobe up and over so the hilum torses on itself, kinking the vessels and bronchus.</li>

  </ul>

function defibTool(){return `

  if(navigator.share){ navigator.share(data).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(data.url).then(()=>alert('Link copied: '+data.url)).catch(()=>{}); }
  else { prompt('Copy this link:', data.url); }
}
window.shareLink=shareLink;

/* ============ tap-to-zoom lightbox ============ */
function initLightbox(){
  const lb=document.getElementById('lightbox');
  const lbImg=document.getElementById('lbImg');
  const lbClose=document.getElementById('lbClose');
  if(!lb||!lbImg||!lbClose) return;
  let scale=1, tx=0, ty=0;
  const MIN=1, MAX=5;
  // gesture state
  let panning=false, startX=0, startY=0, baseTx=0, baseTy=0;
  let pinchDist=0, pinchScale=1;

  function apply(){
    lbImg.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
    lb.classList.toggle('zoomed', scale>1.01);
  }
  function reset(){ scale=1; tx=0; ty=0; apply(); }
  function clampScale(s){ return Math.max(MIN, Math.min(MAX, s)); }

  function open(src, alt){
    lbImg.src=src; lbImg.alt=alt||'';
    reset();
    lb.classList.add('open');
    document.body.style.overflow='hidden';
  }
  function close(){
    lb.classList.remove('open');
    document.body.style.overflow='';
    lbImg.src='';
  }

  // OPEN via event delegation: any img inside .photo or .img-slot, except the QR
  document.addEventListener('click', function(e){
    const img=e.target.closest && e.target.closest('.photo img, .img-slot img');
    if(!img) return;
    const src=img.getAttribute('src')||'';
    if(/share-qr\.png$/i.test(src)) return; // skip QR codes
    e.preventDefault();
    open(src, img.getAttribute('alt'));
  });

  // CLOSE
  lbClose.addEventListener('click', close);
  lb.addEventListener('click', function(e){ if(e.target===lb) close(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && lb.classList.contains('open')) close(); });

  // DESKTOP: wheel zoom toward cursor
  lb.addEventListener('wheel', function(e){
    if(!lb.classList.contains('open')) return;
    e.preventDefault();
    const prev=scale;
    scale=clampScale(scale * (e.deltaY<0 ? 1.12 : 0.89));
    const rect=lbImg.getBoundingClientRect();
    const cx=e.clientX-(rect.left+rect.width/2);
    const cy=e.clientY-(rect.top+rect.height/2);
    const f=scale/prev;
    tx=tx*f - cx*(f-1);
    ty=ty*f - cy*(f-1);
    if(scale<=1){ tx=0; ty=0; }
    apply();
  }, {passive:false});

  // DESKTOP: double-click toggles 1x / 2.5x
  lbImg.addEventListener('dblclick', function(e){
    e.preventDefault();
    if(scale>1.01){ reset(); }
    else { scale=2.5; apply(); }
  });

  // DESKTOP: click-drag pan when zoomed
  lbImg.addEventListener('mousedown', function(e){
    if(scale<=1.01) return;
    e.preventDefault();
    panning=true; lb.classList.add('panning');
    startX=e.clientX; startY=e.clientY; baseTx=tx; baseTy=ty;
  });
  window.addEventListener('mousemove', function(e){
    if(!panning) return;
    tx=baseTx+(e.clientX-startX); ty=baseTy+(e.clientY-startY); apply();
  });
  window.addEventListener('mouseup', function(){ panning=false; lb.classList.remove('panning'); });

  // TOUCH: 1-finger pan (when zoomed), 2-finger pinch
  lbImg.addEventListener('touchstart', function(e){
    if(e.touches.length===1 && scale>1.01){
      panning=true; lb.classList.add('panning');
      startX=e.touches[0].clientX; startY=e.touches[0].clientY; baseTx=tx; baseTy=ty;
    } else if(e.touches.length===2){
      panning=false; lb.classList.remove('panning');
      pinchDist=dist(e.touches); pinchScale=scale;
    }
  }, {passive:false});
  lbImg.addEventListener('touchmove', function(e){
    if(e.touches.length===2){
      e.preventDefault();
      const d=dist(e.touches);
      if(pinchDist>0){ scale=clampScale(pinchScale * (d/pinchDist)); if(scale<=1){tx=0;ty=0;} apply(); }
    } else if(panning && e.touches.length===1){
      e.preventDefault();
      tx=baseTx+(e.touches[0].clientX-startX); ty=baseTy+(e.touches[0].clientY-startY); apply();
    }
  }, {passive:false});
  lbImg.addEventListener('touchend', function(e){
    if(e.touches.length===0){ panning=false; lb.classList.remove('panning'); if(scale<=1.01) reset(); }
  });
  function dist(t){ const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy); }
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', initLightbox); }
else { initLightbox(); }

/* ============ PWA: service worker ============ */
// myMedKitt owns offline caching and updates for this integrated copy.
if(false){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  let _reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(_reloaded)return; _reloaded=true; location.reload();
  });
}
</script>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Zoomed image">
  <button class="lightbox-close" id="lbClose" aria-label="Close">&times;</button>
  <img id="lbImg" alt="">
  <div class="lightbox-hint">Pinch or scroll to zoom · drag to pan · tap outside to close</div>
</div>

// Preserve the original controls while keeping arrows above a wrapping toolbar.
const embeddedToolbar = document.querySelector('.toolbar');
const embeddedNavigation = document.querySelector('.nav');
if (embeddedToolbar && embeddedNavigation) {
  const clearToolbar = () => { embeddedNavigation.style.bottom = (embeddedToolbar.getBoundingClientRect().height + 8) + 'px'; };
  new ResizeObserver(clearToolbar).observe(embeddedToolbar);
