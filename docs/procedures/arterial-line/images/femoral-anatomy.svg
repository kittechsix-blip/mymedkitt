<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="400" height="300" fill="#E3F2FD"/>
  <text x="200" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">Right Femoral Region (below inguinal ligament)</text>
  <text x="200" y="38" text-anchor="middle" font-size="11" fill="#546E7A">NAVEL order, lateral &#8594; medial</text>

  <!-- orientation arrows -->
  <text x="36" y="60" font-size="10" fill="#546E7A">Lateral</text>
  <text x="328" y="60" font-size="10" fill="#546E7A">Medial</text>

  <!-- pelvic bone / femoral head -->
  <circle cx="78" cy="170" r="34" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2"/>
  <text x="78" y="174" text-anchor="middle" font-size="9" fill="#37474f">Femoral</text>
  <text x="78" y="186" text-anchor="middle" font-size="9" fill="#37474f">head</text>

  <!-- inguinal ligament -->
  <line x1="40" y1="92" x2="360" y2="78" stroke="#8d6e63" stroke-width="5" stroke-linecap="round"/>
  <text x="250" y="74" font-size="11" font-weight="bold" fill="#6d4c41">Inguinal ligament</text>

  <!-- Structures NAVEL lateral to medial -->
  <!-- Nerve -->
  <g>
    <ellipse cx="150" cy="170" rx="13" ry="42" fill="#ffe082" stroke="#f9a825" stroke-width="2"/>
    <line x1="150" y1="135" x2="150" y2="205" stroke="#f9a825" stroke-width="1"/>
    <line x1="143" y1="150" x2="157" y2="150" stroke="#f9a825" stroke-width="1"/>
    <line x1="143" y1="170" x2="157" y2="170" stroke="#f9a825" stroke-width="1"/>
    <line x1="143" y1="190" x2="157" y2="190" stroke="#f9a825" stroke-width="1"/>
    <text x="150" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#263238">Nerve</text>
    <text x="150" y="243" text-anchor="middle" font-size="9" fill="#546E7A">(N)</text>
  </g>

  <!-- Artery -->
  <g>
    <ellipse cx="200" cy="170" rx="15" ry="42" fill="#d2453b" stroke="#9e2b22" stroke-width="2"/>
    <ellipse cx="200" cy="170" rx="6" ry="30" fill="#b5352c"/>
    <text x="200" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#263238">Artery</text>
    <text x="200" y="243" text-anchor="middle" font-size="9" fill="#546E7A">(A)</text>
  </g>

  <!-- Vein -->
  <g>
    <ellipse cx="250" cy="170" rx="16" ry="42" fill="#1E88E5" stroke="#1565c0" stroke-width="2"/>
    <ellipse cx="250" cy="170" rx="7" ry="30" fill="#42A5F5"/>
    <text x="250" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#263238">Vein</text>
    <text x="250" y="243" text-anchor="middle" font-size="9" fill="#546E7A">(V)</text>
  </g>

  <!-- Empty space -->
  <g>
    <ellipse cx="292" cy="170" rx="9" ry="38" fill="#eceff1" stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="292" y="230" text-anchor="middle" font-size="9" fill="#546E7A">Empty (E)</text>
    <text x="292" y="242" text-anchor="middle" font-size="8" fill="#546E7A">femoral canal</text>
  </g>

  <!-- Lymphatics -->
  <g>
    <circle cx="324" cy="150" r="7" fill="#a5d6a7" stroke="#1f9d6b" stroke-width="1.5"/>
    <circle cx="328" cy="178" r="7" fill="#a5d6a7" stroke="#1f9d6b" stroke-width="1.5"/>
    <circle cx="322" cy="200" r="6" fill="#a5d6a7" stroke="#1f9d6b" stroke-width="1.5"/>
    <text x="324" y="230" text-anchor="middle" font-size="9" fill="#263238">Lymph (L)</text>
  </g>

  <!-- Needle entering artery -->
  <g>
    <line x1="170" y1="278" x2="200" y2="180" stroke="#455a64" stroke-width="3"/>
    <polygon points="200,180 195,189 205,187" fill="#455a64"/>
    <rect x="158" y="276" width="22" height="8" rx="2" fill="#455a64" transform="rotate(-72 169 280)"/>
    <text x="118" y="290" font-size="10" fill="#455a64">Needle &#8594; artery</text>
  </g>

  <!-- mnemonic key -->
  <text x="392" y="296" text-anchor="end" font-size="9" fill="#546E7A">N&#183;A&#183;V&#183;E&#183;L</text>
</svg>