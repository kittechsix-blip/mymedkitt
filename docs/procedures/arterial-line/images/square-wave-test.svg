<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 760" font-family="sans-serif">
  <rect width="400" height="760" fill="#ffffff"/>
  <text x="200" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#263238">Fast-Flush (Square-Wave) Dynamic Response Test</text>
  <text x="200" y="44" text-anchor="middle" font-size="11" fill="#546E7A">Snap the pigtail flush; observe how the trace settles back to baseline</text>

  <!-- ============ PANEL 1: OPTIMALLY DAMPED ============ -->
  <g>
    <rect x="16" y="58" width="368" height="210" rx="10" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5"/>
    <text x="32" y="80" font-size="14" font-weight="bold" fill="#1E88E5">1 · OPTIMALLY DAMPED</text>
    <rect x="290" y="68" width="80" height="20" rx="10" fill="#1f9d6b"/>
    <text x="330" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">IDEAL</text>

    <!-- waveform area -->
    <rect x="32" y="96" width="336" height="120" rx="6" fill="#ffffff" stroke="#90CAF9" stroke-width="1"/>
    <!-- baseline -->
    <line x1="32" y1="190" x2="368" y2="190" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- flush + 1-2 small oscillations -->
    <path d="M40 175 L80 175 L80 112 L120 112 L120 175
             Q132 205 144 188 Q154 175 162 184 Q168 190 174 188"
          fill="none" stroke="#d2453b" stroke-width="2.5"/>
    <!-- arterial waveform: clear dicrotic notch -->
    <path d="M174 188 L186 188
             C192 188 196 130 206 130
             C214 130 216 168 222 168
             C226 168 228 156 234 158
             C240 160 244 188 256 188 L266 188
             C272 188 276 130 286 130
             C294 130 296 168 302 168
             C306 168 308 156 314 158
             C320 160 324 188 336 188 L360 188"
          fill="none" stroke="#d2453b" stroke-width="2.5"/>
    <text x="100" y="232" text-anchor="middle" font-size="9" fill="#546E7A">flush</text>
    <text x="150" y="232" text-anchor="middle" font-size="9" fill="#546E7A">1–2 oscillations</text>
    <text x="280" y="232" text-anchor="middle" font-size="9" fill="#546E7A">crisp dicrotic notch</text>
    <text x="32" y="258" font-size="11" fill="#263238"><tspan font-weight="bold">Result:</tspan> sharp upstroke, accurate systolic/diastolic.</text>
  </g>

  <!-- ============ PANEL 2: OVERDAMPED ============ -->
  <g>
    <rect x="16" y="278" width="368" height="222" rx="10" fill="#FBE9E7" stroke="#d2453b" stroke-width="1.5"/>
    <text x="32" y="300" font-size="14" font-weight="bold" fill="#d2453b">2 · OVERDAMPED</text>
    <rect x="278" y="288" width="92" height="20" rx="10" fill="#d2453b"/>
    <text x="324" y="302" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">UNDER-READS</text>

    <rect x="32" y="316" width="336" height="120" rx="6" fill="#ffffff" stroke="#EF9A9A" stroke-width="1"/>
    <line x1="32" y1="410" x2="368" y2="410" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- flush + sluggish return, NO oscillation -->
    <path d="M40 395 L80 395 L80 332 L120 332 L120 395
             Q150 405 174 397"
          fill="none" stroke="#d2453b" stroke-width="2.5"/>
    <!-- rounded waveform, blunted peak, lost dicrotic notch -->
    <path d="M174 397 L188 397
             C200 397 206 358 222 356 C238 354 244 392 258 397 L268 397
             C282 397 288 358 304 356 C320 354 326 392 340 397 L360 397"
          fill="none" stroke="#d2453b" stroke-width="2.5"/>
    <text x="100" y="452" text-anchor="middle" font-size="9" fill="#546E7A">flush</text>
    <text x="148" y="452" text-anchor="middle" font-size="9" fill="#546E7A">sluggish return</text>
    <text x="296" y="452" text-anchor="middle" font-size="9" fill="#546E7A">rounded · notch lost</text>
    <text x="32" y="476" font-size="11" fill="#263238"><tspan font-weight="bold">Cause:</tspan> air bubble, kink, clot, low flush bag.</text>
    <text x="32" y="492" font-size="11" fill="#d2453b" font-weight="bold">Underestimates systolic (overestimates diastolic).</text>
  </g>

  <!-- ============ PANEL 3: UNDERDAMPED ============ -->
  <g>
    <rect x="16" y="510" width="368" height="234" rx="10" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.5"/>
    <text x="32" y="532" font-size="14" font-weight="bold" fill="#E65100">3 · UNDERDAMPED</text>
    <rect x="278" y="520" width="92" height="20" rx="10" fill="#FB8C00"/>
    <text x="324" y="534" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">OVER-READS</text>

    <rect x="32" y="548" width="336" height="124" rx="6" fill="#ffffff" stroke="#FFCC80" stroke-width="1"/>
    <line x1="32" y1="630" x2="368" y2="630" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- flush + many oscillations (ringing) -->
    <path d="M40 615 L80 615 L80 564 L120 564 L120 615
             L132 656 L142 588 L150 642 L158 598 L166 636 L173 608 L180 626 L186 616"
          fill="none" stroke="#d2453b" stroke-width="2.5"/>
    <!-- waveform with exaggerated whipped systolic peak + overshoot ring -->
    <path d="M186 616 L196 616
             C202 616 204 560 212 556 L216 562
             C220 568 222 612 228 612 C233 612 235 600 240 602 C246 604 250 616 262 616 L272 616
             C278 616 280 560 288 556 L292 562
             C296 568 298 612 304 612 C309 612 311 600 316 602 C322 604 326 616 338 616 L360 616"
          fill="none" stroke="#d2453b" stroke-width="2.5"/>
    <text x="100" y="688" text-anchor="middle" font-size="9" fill="#546E7A">flush</text>
    <text x="150" y="688" text-anchor="middle" font-size="9" fill="#546E7A">many oscillations (ring)</text>
    <text x="296" y="688" text-anchor="middle" font-size="9" fill="#546E7A">whipped / spiked peak</text>
    <text x="32" y="712" font-size="11" fill="#263238"><tspan font-weight="bold">Cause:</tspan> stiff/long tubing, catheter whip, tachycardia.</text>
    <text x="32" y="728" font-size="11" fill="#E65100" font-weight="bold">Overestimates systolic (underestimates diastolic).</text>
  </g>
</svg>