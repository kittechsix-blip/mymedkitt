<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" font-family="sans-serif">
  <defs>
    <linearGradient id="palePink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7e4"/>
      <stop offset="1" stop-color="#f3d2cc"/>
    </linearGradient>
    <linearGradient id="flushPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6a89c"/>
      <stop offset="1" stop-color="#e87c6d"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="#E3F2FD"/>
  <text x="200" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Modified Allen Test</text>

  <!-- Panel dividers -->
  <line x1="133.3" y1="30" x2="133.3" y2="270" stroke="#bcd9f2" stroke-width="1"/>
  <line x1="266.6" y1="30" x2="266.6" y2="270" stroke="#bcd9f2" stroke-width="1"/>

  <!-- =========== PANEL 1 =========== -->
  <g>
    <rect x="6" y="30" width="121" height="240" rx="6" fill="#ffffff" opacity="0.55"/>
    <circle cx="20" cy="46" r="9" fill="#1E88E5"/>
    <text x="20" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text>
    <text x="35" y="50" font-size="11" font-weight="bold" fill="#263238">Compress both</text>

    <!-- forearm + clenched fist (pale) -->
    <g transform="translate(66,150)">
      <!-- forearm -->
      <rect x="-22" y="-2" width="44" height="80" rx="14" fill="url(#palePink)" stroke="#d9b3ad" stroke-width="1"/>
      <!-- fist -->
      <ellipse cx="0" cy="-18" rx="26" ry="22" fill="url(#palePink)" stroke="#d9b3ad" stroke-width="1"/>
      <!-- knuckle lines -->
      <line x1="-14" y1="-30" x2="-14" y2="-8" stroke="#d9b3ad" stroke-width="1"/>
      <line x1="-2" y1="-32" x2="-2" y2="-6" stroke="#d9b3ad" stroke-width="1"/>
      <line x1="10" y1="-30" x2="10" y2="-8" stroke="#d9b3ad" stroke-width="1"/>
      <!-- thumb -->
      <ellipse cx="-22" cy="-6" rx="7" ry="11" fill="url(#palePink)" stroke="#d9b3ad" stroke-width="1"/>

      <!-- operator fingers on radial + ulnar -->
      <rect x="-24" y="42" width="10" height="20" rx="5" fill="#cfe3f7" stroke="#1E88E5" stroke-width="1.2"/>
      <rect x="14" y="42" width="10" height="20" rx="5" fill="#cfe3f7" stroke="#1E88E5" stroke-width="1.2"/>
    </g>

    <text x="66" y="232" text-anchor="middle" font-size="9" fill="#546E7A">Fist clenched</text>
    <text x="66" y="244" text-anchor="middle" font-size="9" fill="#546E7A">Hand pale</text>
    <text x="38" y="256" text-anchor="middle" font-size="8" fill="#1E88E5">radial</text>
    <text x="94" y="256" text-anchor="middle" font-size="8" fill="#1E88E5">ulnar</text>
  </g>

  <!-- =========== PANEL 2 =========== -->
  <g>
    <rect x="139" y="30" width="121" height="240" rx="6" fill="#ffffff" opacity="0.55"/>
    <circle cx="153" cy="46" r="9" fill="#1E88E5"/>
    <text x="153" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2</text>
    <text x="168" y="50" font-size="11" font-weight="bold" fill="#263238">Release ulnar</text>

    <g transform="translate(199,150)">
      <rect x="-22" y="-2" width="44" height="80" rx="14" fill="url(#palePink)" stroke="#d9b3ad" stroke-width="1"/>
      <ellipse cx="0" cy="-18" rx="26" ry="22" fill="url(#palePink)" stroke="#d9b3ad" stroke-width="1"/>
      <line x1="-14" y1="-30" x2="-14" y2="-8" stroke="#d9b3ad" stroke-width="1"/>
      <line x1="-2" y1="-32" x2="-2" y2="-6" stroke="#d9b3ad" stroke-width="1"/>
      <line x1="10" y1="-30" x2="10" y2="-8" stroke="#d9b3ad" stroke-width="1"/>
      <ellipse cx="-22" cy="-6" rx="7" ry="11" fill="url(#palePink)" stroke="#d9b3ad" stroke-width="1"/>

      <!-- radial still compressed -->
      <rect x="-24" y="42" width="10" height="20" rx="5" fill="#cfe3f7" stroke="#1E88E5" stroke-width="1.2"/>
      <!-- ulnar released finger lifted -->
      <rect x="14" y="30" width="10" height="20" rx="5" fill="#eef6ff" stroke="#90caf9" stroke-width="1.2" transform="rotate(20 19 40)"/>
      <!-- inflow arrow on ulnar side (blood) -->
      <path d="M 30 60 L 24 48" stroke="#d2453b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    </g>

    <defs>
      <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#d2453b"/>
      </marker>
    </defs>

    <text x="199" y="232" text-anchor="middle" font-size="9" fill="#546E7A">Keep radial held</text>
    <text x="199" y="244" text-anchor="middle" font-size="9" fill="#546E7A">Ulnar inflow only</text>
    <text x="231" y="200" font-size="8" fill="#d2453b">flow</text>
  </g>

  <!-- =========== PANEL 3 =========== -->
  <g>
    <rect x="272" y="30" width="121" height="240" rx="6" fill="#ffffff" opacity="0.55"/>
    <circle cx="286" cy="46" r="9" fill="#1f9d6b"/>
    <text x="286" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>
    <text x="301" y="50" font-size="11" font-weight="bold" fill="#263238">Palm flushes</text>

    <g transform="translate(332,150)">
      <rect x="-22" y="-2" width="44" height="80" rx="14" fill="url(#palePink)" stroke="#d9b3ad" stroke-width="1"/>
      <!-- open flushed palm -->
      <ellipse cx="0" cy="-14" rx="26" ry="24" fill="url(#flushPink)" stroke="#cf6a5b" stroke-width="1"/>
      <!-- extended fingers, pink -->
      <rect x="-20" y="-44" width="8" height="22" rx="4" fill="url(#flushPink)" stroke="#cf6a5b" stroke-width="0.8"/>
      <rect x="-9" y="-48" width="8" height="26" rx="4" fill="url(#flushPink)" stroke="#cf6a5b" stroke-width="0.8"/>
      <rect x="2" y="-47" width="8" height="25" rx="4" fill="url(#flushPink)" stroke="#cf6a5b" stroke-width="0.8"/>
      <rect x="13" y="-43" width="8" height="21" rx="4" fill="url(#flushPink)" stroke="#cf6a5b" stroke-width="0.8"/>
      <!-- thumb -->
      <ellipse cx="-24" cy="-8" rx="7" ry="11" fill="url(#flushPink)" stroke="#cf6a5b" stroke-width="0.8"/>
      <!-- radial still held -->
      <rect x="-24" y="42" width="10" height="20" rx="5" fill="#cfe3f7" stroke="#1E88E5" stroke-width="1.2"/>
    </g>

    <text x="332" y="222" text-anchor="middle" font-size="9" font-weight="bold" fill="#1f9d6b">Pink in 5-7 s</text>
    <text x="332" y="236" text-anchor="middle" font-size="9" fill="#1f9d6b">= adequate</text>
    <text x="332" y="248" text-anchor="middle" font-size="9" fill="#1f9d6b">collateral flow</text>
    <text x="332" y="262" text-anchor="middle" font-size="8" fill="#d2453b">&gt;10 s = abnormal</text>
  </g>
</svg>