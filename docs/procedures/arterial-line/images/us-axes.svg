<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef9a9a"/>
      <stop offset="70%" stop-color="#d2453b"/>
      <stop offset="100%" stop-color="#a8332a"/>
    </radialGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef9a9a"/>
      <stop offset="50%" stop-color="#d2453b"/>
      <stop offset="100%" stop-color="#a8332a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#16263a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="320" fill="#E3F2FD"/>
  <text x="400" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#263238">Ultrasound-Guided Vascular Access: Probe Orientation</text>

  <!-- ===================== LEFT PANEL: SHORT AXIS ===================== -->
  <g>
    <rect x="20" y="44" width="370" height="256" rx="12" fill="#ffffff" stroke="#42A5F5" stroke-width="2"/>
    <rect x="20" y="44" width="370" height="30" rx="12" fill="#1E88E5"/>
    <rect x="20" y="60" width="370" height="14" fill="#1E88E5"/>
    <text x="205" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">SHORT AXIS  ·  Out-of-Plane</text>

    <!-- anatomy cross-section -->
    <text x="40" y="96" font-size="11" font-weight="bold" fill="#546E7A">Anatomy (cross-section)</text>
    <!-- skin line -->
    <line x1="46" y1="108" x2="200" y2="108" stroke="#90A4AE" stroke-width="2"/>
    <text x="46" y="121" font-size="9" fill="#90A4AE">skin</text>
    <!-- artery as round circle -->
    <circle cx="123" cy="160" r="26" fill="url(#pulse)"/>
    <circle cx="123" cy="160" r="26" fill="none" stroke="#a8332a" stroke-width="1.5"/>
    <!-- pulsatile rings -->
    <circle cx="123" cy="160" r="33" fill="none" stroke="#d2453b" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"/>
    <text x="123" y="206" text-anchor="middle" font-size="9" fill="#d2453b">round, pulsatile</text>
    <text x="123" y="217" text-anchor="middle" font-size="9" fill="#d2453b" font-weight="bold">ARTERY</text>
    <!-- needle coming straight down, tip = dot -->
    <line x1="123" y1="108" x2="123" y2="146" stroke="#455A64" stroke-width="3"/>
    <circle cx="123" cy="148" r="4.5" fill="#ffffff" stroke="#263238" stroke-width="1.5"/>
    <text x="135" y="138" font-size="9" fill="#263238">needle tip</text>
    <text x="135" y="148" font-size="9" fill="#263238">(bright dot only)</text>

    <!-- probe icon: footprint perpendicular to vessel -->
    <g>
      <rect x="245" y="98" width="40" height="58" rx="6" fill="#546E7A"/>
      <rect x="247" y="150" width="36" height="10" rx="3" fill="#263238"/>
      <text x="265" y="173" text-anchor="middle" font-size="9" fill="#546E7A">probe</text>
      <!-- vessel runs left-right; probe sits across it -->
      <line x1="232" y1="184" x2="300" y2="184" stroke="#d2453b" stroke-width="5" stroke-linecap="round"/>
      <text x="266" y="196" text-anchor="middle" font-size="8" fill="#d2453b">vessel</text>
      <text x="265" y="86" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">probe ACROSS vessel</text>
    </g>

    <!-- resulting screen image -->
    <rect x="44" y="232" width="160" height="56" rx="6" fill="url(#screen)" stroke="#1E88E5" stroke-width="1.5"/>
    <text x="124" y="244" text-anchor="middle" font-size="8" fill="#42A5F5">SCREEN IMAGE</text>
    <circle cx="98" cy="266" r="13" fill="none" stroke="#d2453b" stroke-width="2.5"/>
    <circle cx="98" cy="259" r="2.5" fill="#ffffff"/>
    <text x="98" y="285" text-anchor="middle" font-size="7" fill="#90CAF9">circle + dot</text>

    <rect x="222" y="232" width="146" height="56" rx="6" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1"/>
    <text x="232" y="248" font-size="9" font-weight="bold" fill="#1E88E5">Pros / Cons</text>
    <text x="232" y="262" font-size="8.5" fill="#1f9d6b">+ easy to center vessel</text>
    <text x="232" y="274" font-size="8.5" fill="#1f9d6b">+ see adjacent structures</text>
    <text x="232" y="286" font-size="8.5" fill="#d2453b">– tip location ambiguous</text>
  </g>

  <!-- ===================== RIGHT PANEL: LONG AXIS ===================== -->
  <g>
    <rect x="410" y="44" width="370" height="256" rx="12" fill="#ffffff" stroke="#42A5F5" stroke-width="2"/>
    <rect x="410" y="44" width="370" height="30" rx="12" fill="#1E88E5"/>
    <rect x="410" y="60" width="370" height="14" fill="#1E88E5"/>
    <text x="595" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">LONG AXIS  ·  In-Plane</text>

    <!-- anatomy longitudinal -->
    <text x="430" y="96" font-size="11" font-weight="bold" fill="#546E7A">Anatomy (longitudinal)</text>
    <line x1="436" y1="108" x2="600" y2="108" stroke="#90A4AE" stroke-width="2"/>
    <text x="436" y="121" font-size="9" fill="#90A4AE">skin</text>
    <!-- artery as a tube -->
    <rect x="436" y="150" width="180" height="30" rx="15" fill="url(#tube)" stroke="#a8332a" stroke-width="1.5"/>
    <text x="526" y="200" text-anchor="middle" font-size="9" fill="#d2453b">longitudinal tube</text>
    <text x="526" y="211" text-anchor="middle" font-size="9" font-weight="bold" fill="#d2453b">ARTERY</text>
    <!-- full needle shaft entering at angle into tube -->
    <line x1="440" y1="112" x2="560" y2="162" stroke="#455A64" stroke-width="3.5"/>
    <circle cx="560" cy="162" r="4.5" fill="#ffffff" stroke="#263238" stroke-width="1.5"/>
    <text x="455" y="134" font-size="9" fill="#263238" transform="rotate(22 455 134)">full needle shaft visible</text>

    <!-- probe icon: footprint parallel to vessel -->
    <g>
      <rect x="640" y="98" width="58" height="40" rx="6" fill="#546E7A"/>
      <rect x="640" y="132" width="58" height="10" rx="3" fill="#263238"/>
      <text x="669" y="155" text-anchor="middle" font-size="9" fill="#546E7A">probe</text>
      <!-- vessel runs same direction as probe long edge -->
      <line x1="640" y1="172" x2="698" y2="172" stroke="#d2453b" stroke-width="5" stroke-linecap="round"/>
      <text x="669" y="184" text-anchor="middle" font-size="8" fill="#d2453b">vessel</text>
      <text x="669" y="86" text-anchor="middle" font-size="9" font-weight="bold" fill="#263238">probe ALONG vessel</text>
    </g>

    <!-- resulting screen image -->
    <rect x="434" y="232" width="160" height="56" rx="6" fill="url(#screen)" stroke="#1E88E5" stroke-width="1.5"/>
    <text x="514" y="244" text-anchor="middle" font-size="8" fill="#42A5F5">SCREEN IMAGE</text>
    <rect x="466" y="262" width="96" height="11" rx="5" fill="none" stroke="#d2453b" stroke-width="2"/>
    <line x1="470" y1="256" x2="556" y2="268" stroke="#ffffff" stroke-width="2"/>
    <circle cx="556" cy="268" r="2.5" fill="#ffffff"/>
    <text x="514" y="285" text-anchor="middle" font-size="7" fill="#90CAF9">tube + full needle</text>

    <rect x="612" y="232" width="146" height="56" rx="6" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1"/>
    <text x="622" y="248" font-size="9" font-weight="bold" fill="#1E88E5">Pros / Cons</text>
    <text x="622" y="262" font-size="8.5" fill="#1f9d6b">+ entire needle tracked</text>
    <text x="622" y="274" font-size="8.5" fill="#1f9d6b">+ avoids back-wall puncture</text>
    <text x="622" y="286" font-size="8.5" fill="#d2453b">– must stay perfectly aligned</text>
  </g>
</svg>