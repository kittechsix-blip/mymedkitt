<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif">
  <rect width="400" height="300" fill="#E3F2FD"/>
  <text x="200" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">Phlebostatic Axis &amp; Transducer Leveling</text>

  <!-- bed -->
  <rect x="20" y="200" width="360" height="14" rx="3" fill="#90A4AE"/>
  <rect x="20" y="214" width="360" height="8" fill="#78909C"/>

  <!-- supine torso side profile -->
  <!-- head -->
  <circle cx="58" cy="178" r="16" fill="#cfd8dc" stroke="#546E7A" stroke-width="1.5"/>
  <!-- torso outline (side profile, supine) -->
  <path d="M72 192 C110 178 170 176 230 180 C275 183 305 190 320 198 L320 200 L72 200 Z"
        fill="#cfd8dc" stroke="#546E7A" stroke-width="1.5"/>
  <!-- chest curve / ribcage hint -->
  <path d="M150 184 C170 172 210 172 235 183" fill="none" stroke="#90A4AE" stroke-width="1.2"/>
  <path d="M160 188 q12 -7 24 0 M186 188 q12 -7 24 0 M212 188 q10 -6 20 0"
        fill="none" stroke="#90A4AE" stroke-width="1"/>

  <!-- right atrium level marker -->
  <!-- heart / RA -->
  <ellipse cx="200" cy="187" rx="15" ry="11" fill="#d2453b" opacity="0.85"/>
  <text x="200" y="190" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">RA</text>

  <!-- phlebostatic axis reference line (4th ICS, mid-axillary = RA level) -->
  <line x1="200" y1="187" x2="345" y2="187" stroke="#1E88E5" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="200" cy="187" r="3.5" fill="#1E88E5"/>

  <!-- transducer at correct (zero reference) level -->
  <rect x="318" y="180" width="26" height="14" rx="2" fill="#1E88E5"/>
  <text x="331" y="190" text-anchor="middle" font-size="7" fill="#fff" font-weight="bold">0</text>
  <text x="331" y="172" text-anchor="middle" font-size="8" fill="#1f9d6b" font-weight="bold">LEVELED</text>

  <!-- vertical reference axis (mid-axillary line) -->
  <line x1="200" y1="170" x2="200" y2="205" stroke="#1E88E5" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- TOO HIGH transducer -->
  <rect x="318" y="120" width="26" height="13" rx="2" fill="#fff" stroke="#d2453b" stroke-width="1.5"/>
  <line x1="331" y1="180" x2="331" y2="135" stroke="#d2453b" stroke-width="1.2" marker-end="url(#au)"/>
  <text x="312" y="115" text-anchor="end" font-size="9" fill="#d2453b" font-weight="bold">Too HIGH</text>
  <text x="312" y="127" text-anchor="end" font-size="8.5" fill="#d2453b">falsely LOW reading</text>

  <!-- TOO LOW transducer -->
  <rect x="318" y="240" width="26" height="13" rx="2" fill="#fff" stroke="#d2453b" stroke-width="1.5"/>
  <line x1="331" y1="194" x2="331" y2="240" stroke="#d2453b" stroke-width="1.2" marker-end="url(#ad)"/>
  <text x="312" y="250" text-anchor="end" font-size="9" fill="#d2453b" font-weight="bold">Too LOW</text>
  <text x="312" y="262" text-anchor="end" font-size="8.5" fill="#d2453b">falsely HIGH reading</text>

  <!-- callout: phlebostatic axis -->
  <line x1="200" y1="187" x2="120" y2="245" stroke="#263238" stroke-width="0.8"/>
  <rect x="30" y="246" width="160" height="30" rx="4" fill="#fff" stroke="#1E88E5" stroke-width="1"/>
  <text x="38" y="259" font-size="9.5" fill="#263238" font-weight="bold">Phlebostatic Axis</text>
  <text x="38" y="271" font-size="8.5" fill="#546E7A">4th ICS &#215; mid-axillary line (RA level)</text>

  <!-- 4th ICS label -->
  <text x="200" y="232" text-anchor="middle" font-size="8.5" fill="#546E7A">4th intercostal space</text>

  <defs>
    <marker id="au" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0 6 L4 0 L8 6 Z" fill="#d2453b"/>
    </marker>
    <marker id="ad" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M0 2 L4 8 L8 2 Z" fill="#d2453b"/>
    </marker>
  </defs>
</svg>