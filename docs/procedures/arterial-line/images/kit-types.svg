<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="400" height="300" fill="#E3F2FD"/>
  <text x="200" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">Cannulation Kit Types</text>

  <!-- ===================== Kit 1: Catheter-over-needle ===================== -->
  <g>
    <rect x="14" y="34" width="372" height="78" rx="6" fill="#ffffff" stroke="#42A5F5" stroke-width="1"/>
    <text x="22" y="50" font-size="12" font-weight="bold" fill="#1E88E5">1. Catheter-over-needle (Angiocath)</text>

    <!-- catheter (blue sheath) over the needle -->
    <rect x="40" y="74" width="180" height="11" rx="2" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
    <!-- needle running through, tip past catheter -->
    <line x1="46" y1="79.5" x2="252" y2="79.5" stroke="#546E7A" stroke-width="2.5"/>
    <polygon points="252,79.5 240,75 240,84" fill="#546E7A"/>
    <!-- hub -->
    <rect x="40" y="68" width="22" height="23" rx="3" fill="#42A5F5"/>
    <!-- blood flash -->
    <circle cx="40" cy="79.5" r="3" fill="#d2453b"/>

    <text x="120" y="68" text-anchor="middle" font-size="9.5" fill="#263238">catheter</text>
    <text x="232" y="98" text-anchor="middle" font-size="9.5" fill="#546E7A">needle tip</text>
    <text x="300" y="78" font-size="10" fill="#263238">Advance unit,</text>
    <text x="300" y="92" font-size="10" fill="#263238">slide catheter,</text>
    <text x="300" y="106" font-size="10" fill="#263238">withdraw needle</text>
  </g>

  <!-- ===================== Kit 2: Modified Seldinger ===================== -->
  <g>
    <rect x="14" y="118" width="372" height="78" rx="6" fill="#ffffff" stroke="#42A5F5" stroke-width="1"/>
    <text x="22" y="134" font-size="12" font-weight="bold" fill="#1E88E5">2. Modified Seldinger (catheter over guidewire)</text>

    <!-- guidewire (long, curved tip) -->
    <path d="M40 163 H260 q14 0 18 -7" fill="none" stroke="#1f9d6b" stroke-width="2"/>
    <!-- catheter advancing over wire -->
    <rect x="40" y="157" width="150" height="11" rx="2" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
    <rect x="40" y="151" width="20" height="23" rx="3" fill="#42A5F5"/>

    <text x="110" y="151" text-anchor="middle" font-size="9.5" fill="#263238">catheter</text>
    <text x="232" y="152" text-anchor="middle" font-size="9.5" fill="#1f9d6b">guidewire</text>
    <text x="300" y="156" font-size="10" fill="#263238">Needle &#8594; wire,</text>
    <text x="300" y="170" font-size="10" fill="#263238">remove needle,</text>
    <text x="300" y="184" font-size="10" fill="#263238">thread catheter</text>
  </g>

  <!-- ===================== Kit 3: Integrated guidewire ===================== -->
  <g>
    <rect x="14" y="202" width="372" height="84" rx="6" fill="#ffffff" stroke="#42A5F5" stroke-width="1"/>
    <text x="22" y="218" font-size="12" font-weight="bold" fill="#1E88E5">3. Integrated guidewire (wire from needle hub)</text>

    <!-- needle -->
    <line x1="60" y1="248" x2="230" y2="248" stroke="#546E7A" stroke-width="2.5"/>
    <polygon points="230,248 218,243.5 218,252.5" fill="#546E7A"/>
    <!-- wire advancing from within hub, ahead of needle -->
    <path d="M70 248 H252 q14 0 18 -6" fill="none" stroke="#1f9d6b" stroke-width="2" stroke-dasharray="1 0"/>
    <!-- hub with slider/lever -->
    <rect x="40" y="240" width="26" height="17" rx="3" fill="#42A5F5"/>
    <rect x="49" y="232" width="8" height="9" rx="2" fill="#1E88E5"/>
    <line x1="53" y1="232" x2="60" y2="226" stroke="#1E88E5" stroke-width="2.5"/>
    <text x="62" y="226" font-size="9" fill="#263238">slider</text>

    <text x="150" y="240" text-anchor="middle" font-size="9.5" fill="#546E7A">needle</text>
    <text x="248" y="266" text-anchor="middle" font-size="9.5" fill="#1f9d6b">wire advances out tip</text>

    <text x="300" y="242" font-size="10" fill="#263238">Flash, then</text>
    <text x="300" y="256" font-size="10" fill="#263238">push slider to</text>
    <text x="300" y="270" font-size="10" fill="#263238">deploy wire &#8594;</text>
    <text x="300" y="282" font-size="10" fill="#263238">advance catheter</text>
  </g>

  <!-- legend -->
  <g font-size="9" fill="#263238">
    <rect x="22" y="290" width="10" height="6" fill="#E3F2FD" stroke="#1E88E5"/>
    <text x="35" y="296">catheter</text>
    <line x1="92" y1="293" x2="106" y2="293" stroke="#546E7A" stroke-width="2.5"/>
    <text x="110" y="296">needle</text>
    <line x1="158" y1="293" x2="172" y2="293" stroke="#1f9d6b" stroke-width="2"/>
    <text x="176" y="296">guidewire</text>
    <circle cx="240" cy="293" r="3" fill="#d2453b"/>
    <text x="248" y="296">blood flash</text>
  </g>
</svg>