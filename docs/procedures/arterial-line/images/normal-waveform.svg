<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#E3F2FD"/>
  <rect x="0" y="0" width="400" height="34" fill="#1E88E5"/>
  <text x="200" y="22" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">Normal Arterial Pressure Waveform</text>

  <!-- Plot area -->
  <rect x="52" y="48" width="316" height="200" fill="#ffffff" stroke="#90CAF9" stroke-width="1"/>

  <!-- Gridlines / Y ticks: map mmHg 40-130 to y. y = 248 - (mmHg-40)*(200/90) -->
  <!-- 120 -> 248-80*2.222=70.2 ; 80 -> 248-40*2.222=159.1 ; 40->248 ;130->225? compute below -->
  <!-- 130: 248-90*2.222=48 -->
  <g stroke="#E3F2FD" stroke-width="1">
    <line x1="52" y1="70.2" x2="368" y2="70.2"/>
    <line x1="52" y1="114.6" x2="368" y2="114.6"/>
    <line x1="52" y1="159.1" x2="368" y2="159.1"/>
    <line x1="52" y1="203.5" x2="368" y2="203.5"/>
  </g>

  <!-- Y axis -->
  <line x1="52" y1="48" x2="52" y2="248" stroke="#263238" stroke-width="1.5"/>
  <!-- Y axis labels (mmHg) -->
  <g fill="#263238" font-size="11" text-anchor="end">
    <text x="47" y="74">120</text>
    <text x="47" y="118">100</text>
    <text x="47" y="163">80</text>
    <text x="47" y="207">60</text>
    <text x="47" y="251">40</text>
  </g>
  <text x="16" y="150" fill="#546E7A" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 16 150)">Pressure (mmHg)</text>

  <!-- X axis -->
  <line x1="52" y1="248" x2="368" y2="248" stroke="#263238" stroke-width="1.5"/>
  <text x="210" y="272" fill="#546E7A" font-size="12" font-weight="bold" text-anchor="middle">Time (2 cardiac cycles)</text>

  <!-- MAP line ~ 93 mmHg -> y = 248-53*2.222 = 130.2 -->
  <line x1="52" y1="130.2" x2="368" y2="130.2" stroke="#1f9d6b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="364" y="126" fill="#1f9d6b" font-size="11" font-weight="bold" text-anchor="end">MAP ~93</text>

  <!-- Waveform: two beats. systolic 120 (y70), diastolic 80 (y159), dicrotic notch ~88 (y141), peak after notch ~95(y126) -->
  <!-- Beat 1 starts x=60 end-diastole y159; beat width ~150 -->
  <path d="M60,159
           C 78,159 84,80 100,72
           C 112,66 120,80 132,118
           L 150,136
           C 154,148 160,141 166,141
           C 174,141 182,150 200,159
           C 218,159 224,80 240,72
           C 252,66 260,80 272,118
           L 290,136
           C 294,148 300,141 306,141
           C 314,141 322,150 340,159"
        fill="none" stroke="#d2453b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Feature markers (beat 1) -->
  <!-- Anacrotic limb (upstroke) -->
  <line x1="90" y1="120" x2="84" y2="100" stroke="#546E7A" stroke-width="0.8"/>
  <text x="74" y="96" fill="#263238" font-size="10" text-anchor="middle">Anacrotic</text>
  <text x="74" y="107" fill="#263238" font-size="10" text-anchor="middle">limb</text>

  <!-- Systolic peak -->
  <circle cx="100" cy="72" r="3" fill="#d2453b"/>
  <line x1="100" y1="70" x2="100" y2="56" stroke="#546E7A" stroke-width="0.8"/>
  <text x="100" y="52" fill="#263238" font-size="10" text-anchor="middle">Systolic peak (120)</text>

  <!-- Dicrotic notch -->
  <circle cx="156" cy="145" r="3" fill="#263238"/>
  <line x1="160" y1="143" x2="194" y2="100" stroke="#546E7A" stroke-width="0.8"/>
  <text x="234" y="98" fill="#263238" font-size="10" text-anchor="middle">Dicrotic notch</text>
  <text x="234" y="109" fill="#546E7A" font-size="9" text-anchor="middle">(aortic valve closure)</text>

  <!-- Diastolic runoff -->
  <line x1="180" y1="152" x2="200" y2="178" stroke="#546E7A" stroke-width="0.8"/>
  <text x="208" y="190" fill="#263238" font-size="10" text-anchor="middle">Diastolic runoff</text>

  <!-- End-diastole -->
  <circle cx="200" cy="159" r="3" fill="#d2453b"/>
  <line x1="200" y1="161" x2="200" y2="222" stroke="#546E7A" stroke-width="0.8"/>
  <text x="200" y="234" fill="#263238" font-size="10" text-anchor="middle">End-diastole (80)</text>
</svg>