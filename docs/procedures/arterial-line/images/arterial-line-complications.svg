<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif">
  <rect width="400" height="300" fill="#E3F2FD"/>
  <text x="200" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Radial Arterial Line Complications</text>

  <!-- ===== Panel 1: Thrombosis / Occlusion ===== -->
  <g>
    <rect x="10" y="32" width="185" height="118" rx="8" fill="#ffffff" stroke="#42A5F5" stroke-width="1.5"/>
    <text x="102" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E88E5">1. Thrombosis / Occlusion</text>
    <!-- forearm -->
    <path d="M28 120 Q70 105 120 108 L175 110 L175 132 L120 130 Q70 132 28 138 Z" fill="#f6dcc9" stroke="#546E7A" stroke-width="1"/>
    <!-- hand (pale/pallor) -->
    <path d="M175 105 q22 -8 30 4 q6 12 -4 22 q-12 10 -26 4 Z" fill="#eef1f3" stroke="#546E7A" stroke-width="1"/>
    <text x="195" y="148" text-anchor="middle" font-size="9" fill="#546E7A">distal pallor</text>
    <!-- artery with clot -->
    <path d="M30 122 L150 116" stroke="#d2453b" stroke-width="4" fill="none"/>
    <path d="M150 116 L172 115" stroke="#9aa7ad" stroke-width="4" fill="none"/>
    <ellipse cx="148" cy="116" rx="8" ry="5" fill="#263238"/>
    <text x="118" y="92" text-anchor="middle" font-size="9" fill="#263238">clot</text>
    <line x1="138" y1="103" x2="148" y2="112" stroke="#263238" stroke-width="0.8"/>
    <line x1="150" y1="116" x2="172" y2="115" stroke="#9aa7ad" stroke-width="4" stroke-dasharray="2 3"/>
    <text x="60" y="135" font-size="8" fill="#fff">flow ↓</text>
  </g>

  <!-- ===== Panel 2: Hematoma ===== -->
  <g>
    <rect x="205" y="32" width="185" height="118" rx="8" fill="#ffffff" stroke="#42A5F5" stroke-width="1.5"/>
    <text x="297" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E88E5">2. Hematoma</text>
    <path d="M222 120 Q270 106 320 108 L378 110 L378 132 L320 130 Q270 132 222 138 Z" fill="#f6dcc9" stroke="#546E7A" stroke-width="1"/>
    <path d="M378 106 q14 -4 20 6 q4 10 -6 16 q-10 6 -18 -2 Z" fill="#f6dcc9" stroke="#546E7A" stroke-width="1"/>
    <!-- artery -->
    <path d="M224 122 L376 116" stroke="#d2453b" stroke-width="3.5" fill="none"/>
    <!-- bruise / swelling -->
    <ellipse cx="295" cy="105" rx="34" ry="20" fill="#8e6fb0" opacity="0.55"/>
    <ellipse cx="295" cy="105" rx="20" ry="11" fill="#5d3f8a" opacity="0.65"/>
    <text x="295" y="72" text-anchor="middle" font-size="9" fill="#263238">diffuse swelling</text>
    <text x="295" y="84" text-anchor="middle" font-size="9" fill="#263238">+ bruising</text>
    <text x="338" y="148" text-anchor="middle" font-size="9" fill="#546E7A">blood in tissue</text>
  </g>

  <!-- ===== Panel 3: Pseudoaneurysm ===== -->
  <g>
    <rect x="10" y="160" width="185" height="130" rx="8" fill="#ffffff" stroke="#42A5F5" stroke-width="1.5"/>
    <text x="102" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E88E5">3. Pseudoaneurysm</text>
    <path d="M28 250 Q70 236 120 238 L175 240 L175 262 L120 260 Q70 262 28 268 Z" fill="#f6dcc9" stroke="#546E7A" stroke-width="1"/>
    <!-- artery -->
    <path d="M30 252 L172 246" stroke="#d2453b" stroke-width="4" fill="none"/>
    <!-- wall defect + pulsatile sac -->
    <circle cx="100" cy="216" r="20" fill="#d2453b" opacity="0.35"/>
    <circle cx="100" cy="216" r="12" fill="#d2453b"/>
    <path d="M93 249 L100 228" stroke="#d2453b" stroke-width="5"/>
    <text x="100" y="195" text-anchor="middle" font-size="9" fill="#263238">pulsatile sac</text>
    <!-- pulsation arrows -->
    <path d="M124 210 q8 -3 10 -10" stroke="#d2453b" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
    <path d="M124 222 q8 3 10 10" stroke="#d2453b" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
    <text x="150" y="262" text-anchor="middle" font-size="9" fill="#546E7A">wall defect</text>
  </g>

  <!-- ===== Panel 4: Distal digital ischemia ===== -->
  <g>
    <rect x="205" y="160" width="185" height="130" rx="8" fill="#ffffff" stroke="#42A5F5" stroke-width="1.5"/>
    <text x="297" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E88E5">4. Digital Ischemia</text>
    <!-- palm -->
    <path d="M250 250 q-6 -28 14 -32 q26 -4 30 14 l2 18 q-2 14 -22 16 q-22 2 -24 -16 Z" fill="#f6dcc9" stroke="#546E7A" stroke-width="1"/>
    <!-- fingers with dusky tips -->
    <g stroke="#546E7A" stroke-width="1">
      <path d="M258 220 q-3 -22 4 -34 l8 0 q4 14 2 34 Z" fill="#f6dcc9"/>
      <path d="M272 216 q-2 -26 4 -40 l8 0 q4 16 2 40 Z" fill="#f6dcc9"/>
      <path d="M286 218 q0 -24 6 -36 l8 0 q3 14 1 36 Z" fill="#f6dcc9"/>
      <path d="M300 224 q2 -18 8 -28 l7 0 q2 12 0 30 Z" fill="#f6dcc9"/>
    </g>
    <!-- dusky/cyanotic fingertips -->
    <g fill="#5d3f8a">
      <path d="M260 192 q3 -6 8 -6 q5 0 6 6 q-1 6 -7 6 q-6 0 -7 -6Z"/>
      <path d="M274 182 q3 -6 8 -6 q5 0 6 6 q-1 6 -7 6 q-6 0 -7 -6Z"/>
      <path d="M288 188 q3 -6 8 -6 q5 0 6 6 q-1 6 -7 6 q-6 0 -7 -6Z"/>
      <path d="M302 200 q3 -5 7 -5 q5 0 6 5 q-1 6 -6 6 q-6 0 -7 -6Z"/>
    </g>
    <text x="297" y="282" text-anchor="middle" font-size="9" fill="#546E7A">dusky / cyanotic fingertips</text>
  </g>

  <defs>
    <marker id="ar" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#d2453b"/>
    </marker>
  </defs>
</svg>