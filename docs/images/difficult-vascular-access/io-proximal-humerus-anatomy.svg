<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title desc"><title id="title">Proximal humerus</title><desc id="desc">Right shoulder, anterior-oblique schematic • palpable greater tubercle. Original schematic • Not to scale • Direction inset is schematic and does not depict insertion depth</desc><defs><linearGradient id="bone" x1="0" x2="1"><stop stop-color="#E0D5C0"/><stop offset=".5" stop-color="#FFFDF3"/><stop offset="1" stop-color="#DACCB5"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#BF5700" stroke-width="1.4"/></marker></defs><rect width="960" height="740" rx="22" fill="#FFF8F2"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="47" font-size="16" fill="#BF5700" font-weight="700">IO ANATOMY  /  LANDMARK GUIDE</text><text x="36" y="89" font-size="32" fill="#332820" font-weight="700">Proximal humerus</text><text x="36" y="121" font-size="18" fill="#68594D" font-weight="400">Right shoulder, anterior-oblique schematic • palpable greater tubercle</text><line x1="36" y1="143" x2="924" y2="143" stroke="#DED1C5"/><text x="42" y="181" font-size="15" fill="#68594D" font-weight="700">LATERAL</text><text x="350" y="181" font-size="15" fill="#68594D" font-weight="700">MEDIAL</text><path d="M216 231 Q225 193 266 204 Q296 173 334 200 Q376 223 361 264 Q350 285 318 293 L298 338 L291 618 L228 618 L231 337 Q217 305 205 286 Q195 262 216 231 Z" fill="url(#bone)" stroke="#8F8170" stroke-width="3"/><path d="M277 242 Q291 271 276 303" fill="none" stroke="#9D8C72" stroke-width="3"/><circle cx="234" cy="250" r="19" fill="#BF5700" fill-opacity=".14" stroke="#BF5700" stroke-width="3"/><circle cx="234" cy="250" r="5" fill="#BF5700"/><polyline points="216,250 122,250 81,278" fill="none" stroke="#BF5700" stroke-width="2.5" stroke-linejoin="round"/><text x="39" y="310" font-size="20" fill="#332820" font-weight="400">Greater</text><text x="39" y="337" font-size="20" fill="#332820" font-weight="400">tubercle</text><polyline points="252,250 450,250 490,238" fill="none" stroke="#BF5700" stroke-width="2.5" stroke-linejoin="round"/><text x="510" y="233" font-size="20" fill="#332820" font-weight="400">TARGET</text><text x="510" y="260" font-size="20" fill="#332820" font-weight="400">Greater tubercle of the humerus</text><text x="510" y="287" font-size="20" fill="#332820" font-weight="400">Palpate before selecting the site</text><text x="510" y="327" font-size="20" fill="#332820" font-weight="400">POSITION</text><text x="510" y="354" font-size="20" fill="#332820" font-weight="400">Arm adducted beside the torso;</text><text x="510" y="381" font-size="20" fill="#332820" font-weight="400">shoulder internally rotated;</text><text x="510" y="408" font-size="20" fill="#332820" font-weight="400">hand resting over the abdomen.</text><rect x="492" y="446" width="429" height="196" rx="14" fill="#FFFFFF" stroke="#DED1C5"/><text x="510" y="474" font-size="14" fill="#BF5700" font-weight="700">DIRECTION INSET • NOT A DEPTH GUIDE</text><line x1="535" y1="568" x2="735" y2="568" stroke="#8F8170" stroke-width="5"/><path d="M568 504 L666 602" stroke="#BF5700" stroke-width="4" marker-end="url(#arrow)"/><path d="M605 568 A35 35 0 0 0 594 543" fill="none" stroke="#BF5700" stroke-width="2"/><text x="611" y="547" font-size="20" fill="#BF5700" font-weight="700">45°</text><text x="520" y="592" font-size="14" fill="#68594D" font-weight="400">Anterior plane</text><text x="748" y="536" font-size="20" fill="#332820" font-weight="400">Toward the</text><text x="748" y="563" font-size="20" fill="#332820" font-weight="400">opposite hip.</text><text x="510" y="627" font-size="15" fill="#68594D" font-weight="400">Posteromedial direction; not an insertion-depth guide.</text><rect x="24" y="678" width="912" height="43" rx="9" fill="#EEE3D8"/><text x="40" y="705" font-size="16" fill="#68594D" font-weight="400">Original schematic • Not to scale • Direction inset is schematic and does not depict insertion depth</text></g></svg>