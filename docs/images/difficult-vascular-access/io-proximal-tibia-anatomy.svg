<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title desc"><title id="title">Proximal tibia</title><desc id="desc">Right leg, anterior schematic • bone landmarks shown through soft tissue. Original schematic • Not to scale • Confirm patient landmarks and device-specific instructions</desc><defs><linearGradient id="bone" x1="0" x2="1"><stop stop-color="#E0D5C0"/><stop offset=".5" stop-color="#FFFDF3"/><stop offset="1" stop-color="#DACCB5"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#BF5700" stroke-width="1.4"/></marker></defs><rect width="960" height="740" rx="22" fill="#FFF8F2"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="47" font-size="16" fill="#BF5700" font-weight="700">IO ANATOMY  /  LANDMARK GUIDE</text><text x="36" y="89" font-size="32" fill="#332820" font-weight="700">Proximal tibia</text><text x="36" y="121" font-size="18" fill="#68594D" font-weight="400">Right leg, anterior schematic • bone landmarks shown through soft tissue</text><line x1="36" y1="143" x2="924" y2="143" stroke="#DED1C5"/><text x="48" y="183" font-size="15" fill="#68594D" font-weight="700">LATERAL</text><text x="378" y="183" font-size="15" fill="#68594D" font-weight="700">MEDIAL</text><path d="M225 204 Q246 181 280 207 Q315 184 352 205 Q368 227 351 252 L325 291 L315 640 L240 640 L238 300 L213 250 Q200 226 225 204 Z" fill="url(#bone)" stroke="#8F8170" stroke-width="3"/><path d="M176 268 Q195 246 211 266 Q223 281 208 303 L195 640 L173 640 L183 305 Q163 287 176 268 Z" fill="url(#bone)" stroke="#8F8170" stroke-width="3"/><path d="M266 264 Q291 260 299 282 L286 314 Q266 309 266 264" fill="#D1C1A6" stroke="#8F8170" stroke-width="2"/><path d="M274 319 L272 635" stroke="#B5A58F" stroke-width="3" fill="none"/><text x="67" y="400" font-size="18" fill="#68594D" font-weight="400">Fibula</text><polyline points="126,395 178,395" fill="none" stroke="#BF5700" stroke-width="2.5" stroke-linejoin="round"/><circle cx="315" cy="296" r="19" fill="#BF5700" fill-opacity=".14" stroke="#BF5700" stroke-width="3"/><circle cx="315" cy="296" r="5" fill="#BF5700"/><polyline points="333,296 480,322 515,299" fill="none" stroke="#BF5700" stroke-width="2.5" stroke-linejoin="round"/><text x="535" y="295" font-size="20" fill="#332820" font-weight="400">TARGET</text><text x="535" y="322" font-size="20" fill="#332820" font-weight="400">Flat anteromedial tibial face</text><text x="535" y="349" font-size="20" fill="#332820" font-weight="400">medial to the tibial tuberosity</text><polyline points="285,282 450,230 515,230" fill="none" stroke="#BF5700" stroke-width="2.5" stroke-linejoin="round"/><text x="535" y="226" font-size="20" fill="#332820" font-weight="400">Tibial tuberosity</text><text x="535" y="253" font-size="20" fill="#332820" font-weight="400">Palpate this anterior landmark</text><polyline points="274,457 480,457 515,437" fill="none" stroke="#BF5700" stroke-width="2.5" stroke-linejoin="round"/><text x="535" y="435" font-size="20" fill="#332820" font-weight="400">Anterior tibial crest</text><text x="535" y="462" font-size="20" fill="#332820" font-weight="400">Target lies medial to the crest,</text><text x="535" y="489" font-size="20" fill="#332820" font-weight="400">on the flat surface</text><text x="535" y="550" font-size="20" fill="#332820" font-weight="400">Anterior view: right leg</text><text x="535" y="577" font-size="20" fill="#332820" font-weight="400">Insert 90° to the bone surface.</text><text x="535" y="604" font-size="20" fill="#332820" font-weight="400">Target marker indicates a region,</text><text x="535" y="631" font-size="20" fill="#332820" font-weight="400">not a measured puncture point.</text><rect x="24" y="678" width="912" height="43" rx="9" fill="#EEE3D8"/><text x="40" y="705" font-size="16" fill="#68594D" font-weight="400">Original schematic • Not to scale • Confirm patient landmarks and device-specific instructions</text></g></svg>