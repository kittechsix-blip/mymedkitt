<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
  <title id="t">Schematic insulin action curves over 24 hours</title>
  <desc id="d">Glargine is a flat low line. NPH rises to a broad peak around 4 to 12 hours. Regular insulin peaks near 3 hours and fades by 8. Rapid analog peaks near 1.5 hours and fades by 4.</desc>
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">Insulin action over 24 hours (schematic)</text>
  <rect x="160" y="50" width="200" height="250" fill="#fff3c4" opacity="0.7"/>
  <text x="260" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7a5b00">NPH peak window 4 to 12 h</text>
  <line x1="60" y1="300" x2="670" y2="300" stroke="#444" stroke-width="2"/>
  <line x1="60" y1="50" x2="60" y2="300" stroke="#444" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">
    <text x="60" y="318">0</text><text x="160" y="318">4</text><text x="260" y="318">8</text><text x="360" y="318">12</text><text x="460" y="318">16</text><text x="560" y="318">20</text><text x="660" y="318">24 h</text>
    <text x="360" y="338">Hours after injection</text>
  </g>
  <text x="22" y="175" transform="rotate(-90 22 175)" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Insulin effect</text>
  <path d="M60 300 C75 300 85 90 100 90 C120 90 135 280 170 300 L660 300" fill="none" stroke="#c62828" stroke-width="3"/>
  <path d="M60 300 C80 300 105 140 135 140 C175 140 200 280 260 300 L660 300" fill="none" stroke="#ef6c00" stroke-width="3"/>
  <path d="M60 300 C90 300 130 240 190 180 C240 130 300 130 350 190 C400 250 440 290 500 300 L660 300" fill="none" stroke="#1565c0" stroke-width="3"/>
  <path d="M60 296 C100 272 150 266 660 268" fill="none" stroke="#2e7d32" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="13">
    <rect x="80" y="352" width="18" height="4" fill="#c62828"/><text x="104" y="358" fill="#333">Rapid analog (lispro, aspart): peak 1 to 2 h, gone by 4 h</text>
    <rect x="80" y="370" width="18" height="4" fill="#ef6c00"/><text x="104" y="376" fill="#333">Regular: give 30 min before meal, peak 2 to 4 h</text>
    <rect x="400" y="352" width="18" height="4" fill="#1565c0"/><text x="424" y="358" fill="#333">NPH: peak 4 to 12 h (overnight low risk)</text>
    <rect x="400" y="370" width="18" height="4" fill="#2e7d32"/><text x="424" y="376" fill="#333">Glargine: flat, once daily</text>
  </g>
  <text x="360" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Original schematic, not exact timing for an individual patient. Labels: FDA/DailyMed insulin labels.</text>
</svg>
