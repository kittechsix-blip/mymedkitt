<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-labelledby="t d">
  <title id="t">Cauchy frostbite grade by anatomic level</title>
  <desc id="d">One finger and the hand bones beneath it, divided from the fingertip toward the wrist: distal phalanx grade 1, middle phalanx grade 2, proximal phalanx grade 3, metacarpal grade 4, carpal bones grade 5. Grade 0 is no lesion.</desc>
  <rect width="640" height="760" fill="#ffffff"/>
  <text x="320" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#222">Cauchy grade: the most proximal level</text>
  <text x="320" y="68" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#555">reached by the lesion after rewarming</text>

  <!-- bones, fingertip at top -->
  <g stroke="#5a3b2e" stroke-width="3">
    <rect x="150" y="100" width="90" height="90" rx="40" fill="#f6c9b8"/>
    <rect x="150" y="200" width="90" height="110" rx="22" fill="#ee9f86"/>
    <rect x="150" y="320" width="90" height="140" rx="22" fill="#e07158"/>
    <rect x="140" y="470" width="110" height="160" rx="24" fill="#c94a35"/>
    <rect x="110" y="640" width="170" height="80" rx="20" fill="#9e2f22"/>
  </g>
  <!-- joint labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#555" text-anchor="end">
    <text x="138" y="200">DIP</text>
    <text x="138" y="320">PIP</text>
    <text x="128" y="470">MCP / MTP</text>
  </g>
  <!-- leader lines and grade labels -->
  <g stroke="#888" stroke-width="2">
    <line x1="245" y1="145" x2="330" y2="145"/>
    <line x1="245" y1="255" x2="330" y2="255"/>
    <line x1="245" y1="390" x2="330" y2="390"/>
    <line x1="255" y1="550" x2="330" y2="550"/>
    <line x1="285" y1="680" x2="330" y2="680"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222">
    <text x="340" y="141" font-size="21" font-weight="700">Grade 1</text>
    <text x="340" y="164" font-size="16" fill="#444">Distal phalanx</text>
    <text x="340" y="251" font-size="21" font-weight="700">Grade 2</text>
    <text x="340" y="274" font-size="16" fill="#444">Middle phalanx</text>
    <text x="340" y="294" font-size="14" fill="#666">(thumb / big toe: proximal phalanx)</text>
    <text x="340" y="386" font-size="21" font-weight="700">Grade 3</text>
    <text x="340" y="409" font-size="16" fill="#444">Proximal phalanx</text>
    <text x="340" y="546" font-size="21" font-weight="700">Grade 4</text>
    <text x="340" y="569" font-size="16" fill="#444">Metacarpal / metatarsal</text>
    <text x="340" y="676" font-size="21" font-weight="700">Grade 5</text>
    <text x="340" y="699" font-size="16" fill="#444">Carpal / tarsal</text>
  </g>
  <text x="320" y="748" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#555">Grade 0 = no lesion. Higher grade = more proximal = greater amputation risk.</text>
</svg>
