<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" aria-labelledby="title desc">
  <title id="title">Pericardiotomy landmark: avoid the phrenic nerve</title>
  <desc id="desc">Procedural diagram showing the phrenic nerve on the lateral pericardium and the safe incision line anterior and medial to it.</desc>
  <rect width="820" height="560" fill="#fbfbf8"/>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; font-size: 28px; font-weight: 800; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; font-size: 22px; font-weight: 800; }
    .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; font-size: 18px; font-weight: 700; }
    .note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; font-size: 20px; font-weight: 700; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; rx: 14; }
    .arrow { stroke: #374151; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 Z" fill="#374151"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#111827" flood-opacity="0.13"/>
    </filter>
  </defs>

  <text x="410" y="48" text-anchor="middle" class="title">Pericardium: avoid phrenic nerve</text>
  <text x="410" y="78" text-anchor="middle" class="small">Incise anterior/medial to the nerve, then extend apex to aortic root</text>

  <g transform="translate(105 100)" filter="url(#shadow)">
    <ellipse cx="330" cy="195" rx="230" ry="150" fill="#dbeafe" stroke="#2563eb" stroke-width="7"/>
    <text x="330" y="368" text-anchor="middle" class="small">Pericardium</text>

    <path d="M286 84 C220 100 180 155 185 223 C190 300 260 335 325 315 C380 298 414 247 410 191 C405 121 355 70 286 84Z" fill="#ef767a" stroke="#9f1239" stroke-width="5"/>
    <path d="M336 95 C382 115 411 156 410 202 C409 253 376 297 325 315 C352 245 356 164 336 95Z" fill="#f9a8a8" opacity="0.9"/>
    <text x="298" y="206" text-anchor="middle" class="label" fill="#7f1d1d">Heart</text>

    <path d="M178 58 C163 120 160 187 171 252 C180 305 197 346 223 384" fill="none" stroke="#f59e0b" stroke-width="18" stroke-linecap="round"/>
    <path d="M178 58 C163 120 160 187 171 252 C180 305 197 346 223 384" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <circle cx="178" cy="58" r="17" fill="#fbbf24" stroke="#78350f" stroke-width="4"/>

    <path d="M244 72 C224 137 222 213 241 280 C255 326 280 360 314 388" fill="none" stroke="#16a34a" stroke-width="12" stroke-linecap="round" stroke-dasharray="18 14"/>

    <text x="22" y="64" class="label" fill="#92400e">PHRENIC NERVE</text>
    <path d="M185 72 L120 78" class="arrow"/>
    <text x="348" y="82" class="label" fill="#166534">SAFE INCISION</text>
    <path d="M342 92 L260 120" class="arrow"/>
    <text x="69" y="336" class="small" fill="#92400e">lateral pericardium</text>
    <text x="321" y="336" class="small" fill="#166534">anterior / medial</text>
  </g>

  <rect x="64" y="470" width="692" height="66" class="box"/>
  <text x="410" y="498" text-anchor="middle" class="note">1. Identify nerve. 2. Tent pericardium away from heart.</text>
  <text x="410" y="525" text-anchor="middle" class="note">3. Open anterior/medial to nerve. 4. Extend apex to aortic root.</text>
</svg>
