<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-labelledby="t d">
  <title id="t">Incomplete Kawasaki disease algorithm</title>
  <desc id="d">Fever 5 days or more with 2 or 3 features, or an infant with 7 days of unexplained fever. Check CRP and ESR. CRP under 3 mg/dL and ESR under 40: recheck daily while fever lasts; echo if peeling. CRP 3 or more or ESR 40 or more: count 6 supplemental labs (anemia, platelets 450,000 or more after day 7, albumin 3.0 or less, raised ALT, WBC 15,000 or more, urine 10 or more WBC per high-power field). Three or more: treat now with IVIG and aspirin before the echo. Fewer than 3: echo. Positive echo: treat. Negative echo with fever: repeat echo or consult an expert.</desc>
  <rect width="640" height="760" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#444"/></marker></defs>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="320" y="34" font-size="23" font-weight="700" fill="#222">Incomplete Kawasaki: when to treat</text>

    <rect x="120" y="52" width="400" height="62" rx="10" fill="#eef2f7" stroke="#44617f" stroke-width="2"/>
    <text x="320" y="78" font-size="16" fill="#222">Fever 5+ days with 2 or 3 features,</text>
    <text x="320" y="100" font-size="16" fill="#222">or infant with 7+ days unexplained fever</text>
    <line x1="320" y1="114" x2="320" y2="140" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>

    <rect x="200" y="142" width="240" height="44" rx="10" fill="#eef2f7" stroke="#44617f" stroke-width="2"/>
    <text x="320" y="170" font-size="17" font-weight="700" fill="#222">Check CRP and ESR</text>

    <line x1="270" y1="186" x2="150" y2="226" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="370" y1="186" x2="470" y2="226" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="150" y="208" font-size="14" fill="#555">CRP &lt;3 and ESR &lt;40</text>
    <text x="500" y="208" font-size="14" fill="#555">CRP 3+ or ESR 40+</text>

    <rect x="20" y="228" width="250" height="110" rx="10" fill="#f2f7ef" stroke="#4f7a3a" stroke-width="2"/>
    <text x="145" y="256" font-size="16" font-weight="700" fill="#3c6129">Recheck daily</text>
    <text x="145" y="280" font-size="14" fill="#333">while fever lasts</text>
    <text x="145" y="304" font-size="14" fill="#333">Peeling appears: echo,</text>
    <text x="145" y="324" font-size="14" fill="#333">treat if positive</text>

    <rect x="300" y="228" width="320" height="170" rx="10" fill="#fbf0e3" stroke="#d07a1e" stroke-width="2"/>
    <text x="460" y="254" font-size="16" font-weight="700" fill="#b0620f">Count 6 supplemental labs</text>
    <g font-size="14" fill="#333" text-anchor="start">
      <text x="318" y="280">Anemia for age</text>
      <text x="318" y="300">Platelets 450,000+ after day 7</text>
      <text x="318" y="320">Albumin 3.0 g/dL or less</text>
      <text x="318" y="340">Raised ALT</text>
      <text x="318" y="360">WBC 15,000+</text>
      <text x="318" y="380">Urine 10+ WBC/hpf</text>
    </g>

    <line x1="400" y1="398" x2="200" y2="452" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="520" y1="398" x2="520" y2="452" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="260" y="420" font-size="15" font-weight="700" fill="#b8322a">3 or more</text>
    <text x="580" y="430" font-size="15" fill="#555">fewer than 3</text>

    <rect x="20" y="454" width="330" height="128" rx="12" fill="#fbe9e7" stroke="#b8322a" stroke-width="3"/>
    <text x="185" y="484" font-size="19" font-weight="700" fill="#b8322a">TREAT NOW</text>
    <text x="185" y="510" font-size="15" fill="#222">IVIG 2 g/kg + aspirin</text>
    <text x="185" y="534" font-size="15" font-weight="700" fill="#222">before the echo</text>
    <text x="185" y="560" font-size="13" fill="#555">Echo at diagnosis, never delays IVIG</text>

    <rect x="400" y="454" width="220" height="56" rx="10" fill="#eef2f7" stroke="#44617f" stroke-width="2"/>
    <text x="510" y="488" font-size="17" font-weight="700" fill="#222">Echocardiogram</text>

    <line x1="450" y1="510" x2="350" y2="560" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="430" y="548" font-size="14" font-weight="700" fill="#b8322a">positive</text>
    <line x1="560" y1="510" x2="560" y2="610" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="600" y="565" font-size="14" fill="#555">negative</text>

    <rect x="330" y="612" width="290" height="96" rx="10" fill="#f6f6f6" stroke="#777" stroke-width="2"/>
    <text x="475" y="640" font-size="15" font-weight="700" fill="#333">Fever continues?</text>
    <text x="475" y="664" font-size="14" fill="#333">Repeat echo or consult an expert</text>
    <text x="475" y="688" font-size="13" fill="#555">A normal echo does not exclude KD</text>

    <text x="320" y="730" font-size="13" fill="#666">Positive echo: LAD/RCA Z 2.5+, aneurysm, or 3+ suggestive features.</text>
    <text x="320" y="750" font-size="13" fill="#666">After AHA 2017 Figure 3, unchanged in AHA 2024.</text>
  </g>
</svg>
