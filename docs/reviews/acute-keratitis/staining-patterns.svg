<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Corneal staining pattern guide</title><desc id="desc">Six original schematic teaching illustrations, not patient photographs or a diagnostic test. Green represents fluorescein uptake. Gray represents non-fluorescent lesions.</desc><rect width="1200" height="850" fill="#0b1724"/><style>text{font-family:Arial,sans-serif}.title{font-size:32px;font-weight:700;fill:#fff}.label{font-size:21px;font-weight:700;fill:#fff}.sub{font-size:17px;fill:#bdd0df}.note{font-size:15px;fill:#d4e0ea}</style><text class="title" x="36" y="48">Corneal staining: recognize the pattern</text><text class="sub" x="36" y="79">Original schematics • not photographs • patterns overlap and do not identify the organism</text><circle cx="43" cy="109" r="7" fill="#a3fa49"/><text class="note" x="60" y="115">Green: fluorescein uptake</text><circle cx="353" cy="109" r="7" fill="#bdc8ce"/><text class="note" x="370" y="115">Gray: plaque or infiltrate, not fluorescein uptake</text><g transform="translate(24,140)"><rect width="376" height="316" rx="18" fill="#142739" stroke="#2b465b"/><text class="label" x="18" y="31">HSV epithelial keratitis</text><text class="sub" x="18" y="57">Branching epithelial defect</text><circle cx="188" cy="166" r="83" fill="#163c6a" stroke="#577b9a" stroke-width="3"/><circle cx="188" cy="166" r="52" fill="#112e50" opacity=".7"/><path d="M149 210 L173 180 L188 164 L207 144 L220 117 M173 180 L142 161 M188 164 L169 132 M207 144 L238 157" fill="none" stroke="#a3fa49" stroke-width="5" stroke-linecap="round"/><circle cx="149" cy="210" r="6" fill="#a3fa49"/><circle cx="142" cy="161" r="6" fill="#a3fa49"/><circle cx="169" cy="132" r="6" fill="#a3fa49"/><circle cx="220" cy="117" r="6" fill="#a3fa49"/><circle cx="238" cy="157" r="6" fill="#a3fa49"/><text class="note" x="18" y="294">Terminal bulbs; bright ulcer bed.</text></g><g transform="translate(416,140)"><rect width="376" height="316" rx="18" fill="#142739" stroke="#2b465b"/><text class="label" x="18" y="31">VZV pseudodendrite</text><text class="sub" x="18" y="57">Raised epithelial plaque</text><circle cx="188" cy="166" r="83" fill="#163c6a" stroke="#577b9a" stroke-width="3"/><circle cx="188" cy="166" r="52" fill="#112e50" opacity=".7"/><path d="M151 213 Q166 183 186 167 Q198 154 217 120 M173 181 L149 156 M186 167 L171 140 M202 146 L233 157" fill="none" stroke="#bdc8ce" stroke-width="8" stroke-linecap="butt"/><text class="note" x="108" y="266">Gray = raised plaque</text><text class="note" x="18" y="294">No terminal bulbs; little central uptake.</text></g><g transform="translate(808,140)"><rect width="376" height="316" rx="18" fill="#142739" stroke="#2b465b"/><text class="label" x="18" y="31">Superficial punctate injury</text><text class="sub" x="18" y="57">Scattered epithelial defects</text><circle cx="188" cy="166" r="83" fill="#163c6a" stroke="#577b9a" stroke-width="3"/><circle cx="188" cy="166" r="52" fill="#112e50" opacity=".7"/><circle cx="194.6" cy="166.0" r="2.4" fill="#a3fa49"/><circle cx="179.5" cy="173.8" r="2.4" fill="#a3fa49"/><circle cx="189.3" cy="151.2" r="2.4" fill="#a3fa49"/><circle cx="198.7" cy="179.9" r="2.4" fill="#a3fa49"/><circle cx="168.4" cy="162.5" r="2.4" fill="#a3fa49"/><circle cx="206.6" cy="154.2" r="2.4" fill="#a3fa49"/><circle cx="181.8" cy="189.1" r="2.4" fill="#a3fa49"/><circle cx="176.1" cy="143.2" r="2.4" fill="#a3fa49"/><circle cx="213.7" cy="175.4" r="2.4" fill="#a3fa49"/><circle cx="161.2" cy="177.0" r="2.4" fill="#a3fa49"/><circle cx="200.9" cy="138.4" r="2.4" fill="#a3fa49"/><circle cx="197.5" cy="196.4" r="2.4" fill="#a3fa49"/><circle cx="159.3" cy="149.4" r="2.4" fill="#a3fa49"/><circle cx="221.7" cy="158.6" r="2.4" fill="#a3fa49"/><circle cx="167.4" cy="195.3" r="2.4" fill="#a3fa49"/><circle cx="183.2" cy="129.3" r="2.4" fill="#a3fa49"/><circle cx="217.2" cy="190.6" r="2.4" fill="#a3fa49"/><circle cx="148.8" cy="167.6" r="2.4" fill="#a3fa49"/><circle cx="216.6" cy="137.5" r="2.4" fill="#a3fa49"/><circle cx="186.1" cy="207.4" r="2.4" fill="#a3fa49"/><circle cx="160.8" cy="133.4" r="2.4" fill="#a3fa49"/><circle cx="231.1" cy="171.8" r="2.4" fill="#a3fa49"/><circle cx="151.4" cy="191.4" r="2.4" fill="#a3fa49"/><circle cx="198.0" cy="121.6" r="2.4" fill="#a3fa49"/><circle cx="211.1" cy="206.3" r="2.4" fill="#a3fa49"/><circle cx="142.8" cy="151.6" r="2.4" fill="#a3fa49"/><circle cx="231.9" cy="145.7" r="2.4" fill="#a3fa49"/><circle cx="169.0" cy="211.4" r="2.4" fill="#a3fa49"/><circle cx="171.0" cy="118.8" r="2.4" fill="#a3fa49"/><circle cx="233.1" cy="189.7" r="2.4" fill="#a3fa49"/><circle cx="137.9" cy="179.2" r="2.4" fill="#a3fa49"/><circle cx="216.5" cy="121.7" r="2.4" fill="#a3fa49"/><circle cx="197.1" cy="218.8" r="2.4" fill="#a3fa49"/><circle cx="145.0" cy="132.7" r="2.4" fill="#a3fa49"/><circle cx="243.0" cy="161.4" r="2.4" fill="#a3fa49"/><circle cx="150.0" cy="207.1" r="2.4" fill="#a3fa49"/><circle cx="188.3" cy="109.3" r="2.4" fill="#a3fa49"/><circle cx="226.6" cy="208.6" r="2.4" fill="#a3fa49"/><circle cx="130.0" cy="160.6" r="2.4" fill="#a3fa49"/><circle cx="235.0" cy="130.3" r="2.4" fill="#a3fa49"/><circle cx="177.3" cy="224.8" r="2.4" fill="#a3fa49"/><circle cx="155.8" cy="114.8" r="2.4" fill="#a3fa49"/><circle cx="247.0" cy="182.2" r="2.4" fill="#a3fa49"/><circle cx="132.9" cy="194.3" r="2.4" fill="#a3fa49"/><circle cx="209.8" cy="107.3" r="2.4" fill="#a3fa49"/><circle cx="211.9" cy="224.7" r="2.4" fill="#a3fa49"/><circle cx="130.1" cy="138.6" r="2.4" fill="#a3fa49"/><circle cx="249.8" cy="146.9" r="2.4" fill="#a3fa49"/><circle cx="154.9" cy="222.4" r="2.4" fill="#a3fa49"/><circle cx="174.1" cy="101.4" r="2.4" fill="#a3fa49"/><circle cx="242.4" cy="204.6" r="2.4" fill="#a3fa49"/><circle cx="121.1" cy="174.3" r="2.4" fill="#a3fa49"/><circle cx="232.1" cy="114.2" r="2.4" fill="#a3fa49"/><circle cx="190.5" cy="234.6" r="2.4" fill="#a3fa49"/><text class="note" x="18" y="294">UV, dry eye, toxic or exposure injury.</text></g><g transform="translate(24,472)"><rect width="376" height="316" rx="18" fill="#142739" stroke="#2b465b"/><text class="label" x="18" y="31">Abrasion / erosion</text><text class="sub" x="18" y="57">Confluent epithelial defect</text><circle cx="188" cy="166" r="83" fill="#163c6a" stroke="#577b9a" stroke-width="3"/><circle cx="188" cy="166" r="52" fill="#112e50" opacity=".7"/><path d="M149 144 Q171 124 202 142 L217 172 Q202 193 168 184 L147 166 Z" fill="#a3fa49"/><text class="note" x="18" y="294">Shape alone does not exclude infection.</text></g><g transform="translate(416,472)"><rect width="376" height="316" rx="18" fill="#142739" stroke="#2b465b"/><text class="label" x="18" y="31">Subtarsal foreign body</text><text class="sub" x="18" y="57">Vertical linear scratches</text><circle cx="188" cy="166" r="83" fill="#163c6a" stroke="#577b9a" stroke-width="3"/><circle cx="188" cy="166" r="52" fill="#112e50" opacity=".7"/><path d="M163 115 L161 206 M183 110 L181 216 M203 114 L202 210 M222 129 L220 198" stroke="#a3fa49" stroke-width="3" fill="none"/><text class="note" x="18" y="294">Evert lid only after open globe excluded.</text></g><g transform="translate(808,472)"><rect width="376" height="316" rx="18" fill="#142739" stroke="#2b465b"/><text class="label" x="18" y="31">Microbial corneal ulcer</text><text class="sub" x="18" y="57">Defect plus stromal infiltrate</text><circle cx="188" cy="166" r="83" fill="#163c6a" stroke="#577b9a" stroke-width="3"/><circle cx="188" cy="166" r="52" fill="#112e50" opacity=".7"/><ellipse cx="195" cy="164" rx="35" ry="30" fill="#bdc8ce"/><path d="M178 148 L204 145 L216 164 L203 181 L180 176 L173 159Z" fill="#a3fa49"/><text class="note" x="70" y="266">Composite teaching view</text><text class="note" x="18" y="294">Infiltrate seen in white light; urgent review.</text></g><text class="note" x="36" y="830">myMedKitt • Proposed atlas • Always assess acuity, white-light findings, history and anterior chamber.</text></svg>